  if(!raw||raw.version!==1||raw.bankVersion!==BANK_VERSION||!raw.prefs||!['light','dark'].includes(raw.prefs.theme)||typeof raw.prefs.ru!=='boolean'||!raw.practice||typeof raw.practice!=='object'||Array.isArray(raw.practice)||!Array.isArray(raw.read)||!Array.isArray(raw.exams)||raw.exams.length>30)throw Error('This is not a compatible Discrete Lab progress file.');
  const out=defaultState();out.prefs={ru:raw.prefs.ru,theme:raw.prefs.theme};
  for(const [id,r] of Object.entries(raw.practice)){if(!byId.has(id)||!r||!integer(r.attempts,0,100000)||!integer(r.correct,0,r.attempts)||typeof r.solved!=='boolean'||typeof r.assisted!=='boolean'||!Number.isFinite(r.updatedAt))throw Error('Invalid practice record.');out.practice[id]={attempts:r.attempts,correct:r.correct,solved:r.solved,assisted:r.assisted,updatedAt:r.updatedAt};}
  if(raw.read.some(id=>!chapterById.has(id)))throw Error('Invalid chapter record.');
  out.read=[...new Set(raw.read)];out.exams=raw.exams.map(r=>validateExam(r));out.activeExam=raw.activeExam?validateExam(raw.activeExam,true):null;return out;
}
try{const saved=localStorage.getItem(STORAGE_KEY);if(saved)state=validateState(JSON.parse(saved));}catch(error){loadWarning='Saved progress could not be read. You can import a valid backup from Settings.';}
function persist(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));storageOK=true;}catch(error){storageOK=false;toast('Browser storage is unavailable. Export progress before closing this tab.');}}
function toast(message){const el=$('#toast');el.textContent=message;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),5000);}
function ru(text,inline=false){return state.prefs.ru&&text?`<div class="ru-note${inline?' inline':''}" lang="ru">${esc(text)}</div>`:'';}
function math(){if(window.renderMathInElement)renderMathInElement(document.body,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false},{left:'\\(',right:'\\)',display:false},{left:'\\[',right:'\\]',display:true}],throwOnError:false,trust:false,strict:'ignore'});if(window.lucide)lucide.createIcons();}
function applyPrefs(){document.documentElement.dataset.theme=state.prefs.theme;$('#ru-toggle').innerHTML=`<span class="status-dot"></span> RU Hints: ${state.prefs.ru?'ON':'OFF'}`;$('#ru-toggle').setAttribute('aria-pressed',String(state.prefs.ru));$('#theme-toggle').innerHTML=icon(state.prefs.theme==='light'?'moon':'sun');$('#theme-toggle').setAttribute('aria-label',state.prefs.theme==='light'?'Switch to dark theme':'Switch to light theme');}
function solvedCount(chapter){return QUESTIONS.filter(q=>(chapter===undefined||q.chapter===chapter)&&state.practice[q.id]?.solved).length;}
function practiceStats(){const rec=Object.values(state.practice),attempts=rec.reduce((a,r)=>a+r.attempts,0),correct=rec.reduce((a,r)=>a+r.correct,0);return {solved:solvedCount(),attempts,accuracy:attempts?Math.round(100*correct/attempts):null,xp:QUESTIONS.reduce((s,q)=>s+(state.practice[q.id]?.solved?({Easy:10,Medium:20,Hard:30}[q.level]):0),0)};}
function chapterOptions(all=false,selected='all'){return `${all?'<option value="all">All 15 chapters</option>':''}${CHAPTERS.map(c=>`<option value="${c.id}" ${String(selected)===String(c.id)?'selected':''}>${pad(c.id)} · ${esc(c.title)}</option>`).join('')}`;}
function mobileChapter(){return `<div class="mobile-chapter field"><label for="chapter-mobile">Textbook chapter</label><select id="chapter-mobile">${chapterOptions(false,route.chapter)}</select></div>`;}
function chrome(){
  const modules=[['theory','book-open','Theory'],['cheat','notebook-tabs','Cheat Sheet'],['practice','pencil-line','Practice'],['exam','timer','Exam Simulator'],['formulas','sigma','Formulas']];
  $('#module-nav').innerHTML=modules.map(([id,ic,label])=>`<a href="#${id}" class="${route.view===id?'active':''}" ${route.view===id?'aria-current="page"':''}>${icon(ic)}${label}</a>`).join('');
  $('#chapters').innerHTML=CHAPTERS.map(c=>`<button class="chapter-link ${route.view==='theory'&&route.chapter===c.id?'active':''}" data-action="chapter" data-id="${c.id}" ${route.view==='theory'&&route.chapter===c.id?'aria-current="true"':''}><span class="chapter-n">${pad(c.id)}</span><span>${esc(c.title)}</span>${state.read.includes(c.id)?'<span class="chapter-done" aria-label="Read">✓</span>':''}</button>`).join('');
  applyPrefs();
}
function pageTop(label){return `<div class="page-top"><span class="eyebrow">THE OPEN LAB &nbsp; / &nbsp; ${label}</span><span class="status"><span class="status-dot"></span>${storageOK?'Saved on this device':'Export to keep your progress'}</span></div>`;}
function bookButton(page,label){return `<button class="text-button" data-action="book" data-page="${page}">${label||`Book p. ${page}`} ${icon('arrow-up-right')}</button>`;}
function renderTheory(){
  const c=chapterById.get(route.chapter)||CHAPTERS[0],s=practiceStats();

function pool(){return QUESTIONS.filter(q=>(practice.chapter==='all'||q.chapter===Number(practice.chapter))&&(practice.level==='all'||q.level===practice.level)&&(!practice.onlyUnsolved||!state.practice[q.id]?.solved));}
function chooseQuestion(){const list=pool();const candidates=list.filter(q=>q.id!==practice.qid);const available=candidates.length?candidates:list;const q=available[Math.floor(Math.random()*available.length)];practice={...practice,qid:q?.id||null,answer:'',hints:0,checked:false,correct:false};}
function answerControls(q,value,disabled=false){
  if(q.type==='mcq')return `<fieldset class="options" style="border:0;padding:0"><legend class="sr-only">Choose one answer</legend>${q.options.map((o,i)=>`<label class="option"><input type="radio" name="answer" value="${esc(o)}" ${value===o?'checked':''} ${disabled?'disabled':''}><span class="option-letter">${String.fromCharCode(65+i)}</span><span>${esc(o)}</span></label>`).join('')}</fieldset>`;
  return `<div class="answer-field field"><label for="answer-input">${q.type==='number'?'Your answer · number or fraction':'Your answer · use the format in the question'}</label><input id="answer-input" type="text" autocomplete="off" spellcheck="false" ${q.type==='number'?'inputmode="text"':''} maxlength="500" placeholder="${q.type==='number'?'e.g. 12 or 1/2':'Type your answer'}" value="${esc(value)}" ${disabled?'disabled':''}><small class="subtle">${q.type==='number'?'Decimals and simple fractions are accepted.':'Case and repeated spaces are ignored.'}</small></div>`;
}
function steps(q){return `<div class="solution"><h3>Step-by-step solution</h3><ol>${q.steps.map((s,i)=>`<li>${esc(s)}${ru(q.ruSteps?.[i])}</li>`).join('')}</ol><p><strong>Answer:</strong> ${esc(q.answer)}</p><div class="dialog-actions"><a class="text-button" href="#theory/${q.chapter}">Review chapter ${icon('arrow-right')}</a>${bookButton(q.page,`Textbook §${esc(q.section)} · p. ${q.page}`)}</div></div>`;}
function renderPractice(){
  if(!practice.qid||(!practice.checked&&!pool().some(q=>q.id===practice.qid)))chooseQuestion();const q=byId.get(practice.qid),list=pool();
  return pageTop('PRACTICE WITH PURPOSE')+`<h1 class="page-title">A little practice. A lot of clarity.</h1><p class="subtle">${QUESTIONS.length} original questions · 15 chapters · three levels of challenge</p>${ru('Решайте самостоятельно или открывайте подсказки по очереди. XP начисляется один раз за задачу, решённую без подсказок. Без штрафов за обучение.')}
  <div class="toolbar"><div class="field"><label for="practice-chapter">Topic</label><select id="practice-chapter">${chapterOptions(true,practice.chapter)}</select></div><div><span class="field-label">Difficulty</span><div class="chips">${['all','Easy','Medium','Hard'].map(l=>`<button class="chip ${practice.level===l?'active':''}" data-action="difficulty" data-level="${l}" aria-pressed="${practice.level===l}">${l==='all'?'All levels':l}</button>`).join('')}</div></div><label class="subtle" style="padding-bottom:10px"><input type="checkbox" id="unsolved" ${practice.onlyUnsolved?'checked':''}> Unsolved only</label></div>

}
function numeric(text){let s=String(text).trim().replace('−','-');if(/^[-+]?\d+,\d+$/.test(s))s=s.replace(',','.');const atom='[-+]?(?:\\d+(?:\\.\\d*)?|\\.\\d+)(?:[eE][-+]?\\d+)?';if(new RegExp('^'+atom+'$').test(s))return Number(s);const parts=s.split('/').map(s=>s.trim());if(parts.length===2&&parts.every(p=>new RegExp('^'+atom+'$').test(p))&&Number(parts[1])!==0)return Number(parts[0])/Number(parts[1]);return NaN;}
const normalize=s=>String(s).normalize('NFKC').trim().toLowerCase().replace(/\s+/g,' ');
function correct(q,answer){if(typeof answer!=='string'||!answer.trim())return false;if(q.type==='number'){const a=numeric(answer),b=numeric(q.answer);return Number.isFinite(a)&&Number.isFinite(b)&&Math.abs(a-b)<=1e-9*Math.max(1,Math.abs(b));}return [q.answer,...(q.aliases||[])].some(v=>normalize(v)===normalize(answer));}
function checkPractice(){if(practice.checked||practice.hints===3||!practice.qid)return;if(!practice.answer.trim()){toast('Choose or enter an answer first.');$('#answer-input')?.focus();return;}const q=byId.get(practice.qid);practice.correct=correct(q,practice.answer);practice.checked=true;const old=state.practice[q.id]||{attempts:0,correct:0,solved:false,assisted:false,updatedAt:0};const newlySolved=practice.correct&&practice.hints===0&&!old.solved;state.practice[q.id]={attempts:Math.min(100000,old.attempts+1),correct:Math.min(100000,old.correct+(practice.correct?1:0)),solved:old.solved||(practice.correct&&practice.hints===0),assisted:old.assisted||practice.hints>0,updatedAt:now()};persist();render();if(newlySolved&&!matchMedia('(prefers-reduced-motion: reduce)').matches&&window.confetti)confetti({particleCount:45,spread:65,origin:{y:.75},colors:['#a6bf7e','#d9f08a','#355d45'],disableForReducedMotion:true});}
function rngFrom(seed){let h=2166136261;for(const c of seed)h=Math.imul(h^c.charCodeAt(0),16777619);return ()=>{h+=0x6D2B79F5;let t=h;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return ((t^t>>>14)>>>0)/4294967296;};}
function shuffle(list,rng){const a=[...list];for(let i=a.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function examQuestions(mode,seed){const rng=rngFrom(BANK_VERSION+':'+mode+':'+seed);if(mode==='quick')return shuffle(CHAPTERS,rng).slice(0,5).map(c=>shuffle(QUESTIONS.filter(q=>q.chapter===c.id),rng)[0].id);const orderedChapters=shuffle(CHAPTERS,rng);const chosen=orderedChapters.map((c,i)=>shuffle(QUESTIONS.filter(q=>q.chapter===c.id&&q.level===['Easy','Medium','Hard'][i%3]),rng)[0].id);return shuffle([...chosen,...shuffle(QUESTIONS.filter(q=>!chosen.includes(q.id)),rng).slice(0,5).map(q=>q.id)],rng);}
function newSeed(){const a=new Uint32Array(2);if(window.crypto?.getRandomValues)crypto.getRandomValues(a);else {a[0]=now();a[1]=Math.random()*2**32;}return Array.from(a,n=>n.toString(36)).join('').slice(0,12);}
function examStart(mode){if(state.activeExam){route.view='exam';render();return;}const minutes=mode==='quick'?10:Number($('#exam-duration')?.value||75);const seed=shared?.mode===mode?shared.seed:newSeed();const start=now();state.activeExam={id:newSeed(),mode,seed,ids:examQuestions(mode,seed),answers:{},startedAt:start,deadline:start+minutes*60000,index:0};persist();location.hash='#exam';render();}
function finishExam(reason='submitted'){const exam=state.activeExam;if(!exam)return;const finishedAt=Math.max(exam.startedAt,Math.min(now(),exam.deadline));state.exams.unshift({...exam,finishedAt,reason});state.exams=state.exams.slice(0,30);state.activeExam=null;persist();$('#modal').close();route.view='exam';if(location.hash!=='#exam')location.hash='#exam';else render();if(reason==='timeout')toast('Time is up. Your saved answers have been submitted.');}
function elapsedText(ms){const seconds=Math.max(0,Math.floor(ms/1000));return `${Math.floor(seconds/60)}m ${pad(seconds%60)}s`;}
function evaluateExam(e){const scores=e.ids.map(id=>({q:byId.get(id),answer:e.answers[id]||'',ok:correct(byId.get(id),e.answers[id]||'')}));const points=scores.filter(s=>s.ok).length;const topics=CHAPTERS.map(c=>({chapter:c,total:scores.filter(s=>s.q.chapter===c.id).length,correct:scores.filter(s=>s.q.chapter===c.id&&s.ok).length})).filter(c=>c.total);return {scores,points,percent:Math.round(100*points/e.ids.length),topics};}
function renderExam(){if(state.activeExam)return renderActiveExam();return pageTop('A REHEARSAL FOR THE REAL THING')+`<h1 class="page-title">Meet your final. Before your final.</h1><p class="subtle">Choose a format, find your focus, and see what needs another look.</p>${ru('До завершения попытки ответы, теория и подсказки недоступны. Таймер продолжает идти после закрытия вкладки; попытка восстановится в этом браузере.')}${shared?`<div class="exam-warning">${icon('users')} Group exam · ${shared.mode==='full'?'Full final':'Express quiz'} · code <strong>${esc(shared.seed)}</strong>. Everyone using this link receives the same ordered set (${BANK_VERSION}).</div>`:''}
  <div class="two-cards"><section class="card exam-mode featured"><div class="mode-top"><span class="eyebrow">THE COMPLETE CHECK-IN</span><span class="badge">All chapters</span></div><h2>Full final</h2><div class="mode-number">20 <small>questions</small></div><ul><li>At least one question from every chapter</li><li>A mix of easy, medium, and hard problems</li><li>Topic breakdown and reading links at the end</li></ul><div class="field"><label for="exam-duration">Time limit</label><select id="exam-duration">${[60,75,90].map(n=>`<option value="${n}" ${n===(shared?.minutes||75)?'selected':''}>${n} minutes</option>`).join('')}</select></div><button class="button primary" data-action="start-exam" data-mode="full">Start full final ${icon('arrow-right')}</button></section><section class="card exam-mode"><div class="mode-top"><span class="eyebrow">A QUICK CONFIDENCE CHECK</span>${icon('zap')}</div><h2>Express quiz</h2><div class="mode-number">5 <small>questions · 10 minutes</small></div><ul><li>Five randomly selected chapters</li><li>Perfect for a short study break</li><li>Same honest feedback, less time</li></ul><p class="subtle">Your practice progress stays separate from your exam score. Each question is worth one point.</p><button class="button" data-action="start-exam" data-mode="quick">Start express quiz ${icon('arrow-right')}</button><button class="text-button" style="margin-top:18px" data-action="share-group">Create an exam link for your group ${icon('users')}</button></section></div><div class="exam-warning">This is an open study simulator. Answers are hidden by the interface during an attempt; the downloadable source is not a secure exam system. The timer uses your device clock.</div>

function renderActiveExam(){const e=state.activeExam,q=byId.get(e.ids[e.index]),answered=e.ids.filter(id=>e.answers[id]?.trim()).length;return pageTop('EXAM IN PROGRESS')+`<div class="exam-heading"><div><span class="eyebrow">${e.mode==='full'?'FULL FINAL':'EXPRESS QUIZ'} · ${esc(e.seed)}</span><h1 class="page-title">Stay curious. Stay focused.</h1></div><div id="timer" class="timer" aria-label="Time remaining">--:--</div></div><p class="subtle"><span id="answered-count">${answered} / ${e.ids.length} answered</span> · Saved automatically · One point per question</p><nav class="question-nav" aria-label="Exam questions">${e.ids.map((id,i)=>`<button data-action="exam-go" data-index="${i}" class="${e.answers[id]?.trim()?'answered ':''}${i===e.index?'current':''}" ${i===e.index?'aria-current="step"':''} aria-label="Question ${i+1}${e.answers[id]?.trim()?', answered':''}">${i+1}</button>`).join('')}</nav><article class="card question-card"><div class="question-meta"><span>QUESTION ${pad(e.index+1)} / ${e.ids.length} · CH ${pad(q.chapter)}</span><span class="badge ${q.level}">${q.level}</span></div><h2>${esc(q.prompt)}</h2>${ru(q.ruPrompt)}${answerControls(q,e.answers[q.id]||'')}<div class="question-actions"><button class="button" data-action="exam-go" data-index="${e.index-1}" ${e.index===0?'disabled':''}>${icon('arrow-left')} Previous</button>${e.index<e.ids.length-1?`<button class="button primary" data-action="exam-go" data-index="${e.index+1}">Next question ${icon('arrow-right')}</button>`:'<button class="button primary" data-action="submit-exam">Finish & see results</button>'}</div></article><div class="exam-warning">Solutions and study materials unlock when you submit. Changing tabs or reloading does not pause the timer.</div><button class="text-button" data-action="submit-exam">Submit this attempt now ${icon('check')}</button>`;}
function renderReport(exam){const s=evaluateExam(exam),gaps=s.topics.filter(t=>t.correct<t.total);return `<section id="latest-result"><div class="section-heading"><div><span class="eyebrow">YOUR REVISION PLAN</span><h2>${exam.mode==='full'?'Full final':'Express quiz'} results</h2></div><span class="subtle">${new Date(exam.finishedAt).toLocaleDateString('en-GB')}</span></div><div class="result-hero"><div class="score-circle"><strong>${s.percent}%</strong><small>${s.points} / ${exam.ids.length} correct</small></div><div><h2>${s.percent>=80?'Your ideas are connecting.':s.percent>=50?'A solid start. Keep connecting.':'Now you know where to begin.'}</h2><p>${elapsedText(exam.finishedAt-exam.startedAt)} elapsed · ${exam.reason==='timeout'?'Time limit reached':'Submitted'}<br>Code: ${esc(exam.seed)} · Unanswered questions count as incorrect.</p></div></div><section class="card"><h3 style="font-size:16px;margin:0 0 12px">${gaps.length?'Give these chapters another look':'All tested topics answered correctly'}</h3>${ru(gaps.length?'Слабые места: '+gaps.map(g=>g.chapter.ruTitle).join(', '):'В этой попытке все проверенные темы решены верно. Это выборочная проверка, а не оценка всего курса.')}${(gaps.length?gaps:s.topics).map(t=>`<div class="gap-row"><div><strong>${pad(t.chapter.id)} · ${esc(t.chapter.title)}</strong> <span class="muted">${t.correct}/${t.total}</span></div><div class="gap-actions"><a class="text-button" href="#theory/${t.chapter.id}">Review theory →</a>${bookButton(t.chapter.page)}</div></div>`).join('')}<p class="subtle">${15-s.topics.length} chapters were not sampled in this attempt. A short quiz is a snapshot, not a mastery certificate.</p></section><section class="card"><h3 style="font-size:16px;margin:0">Question review</h3>${s.scores.map((item,i)=>`<article class="review-item"><span class="badge">${i+1} · ${item.ok?'Correct':'Review'}</span> <span class="badge">CH ${pad(item.q.chapter)}</span><h3>${esc(item.q.prompt)}</h3>${ru(item.q.ruPrompt)}<p class="subtle student-answer">Your answer: ${esc(item.answer||'Not answered')}</p><details><summary>${item.ok?'Review reasoning':'See correct answer & solution'}</summary>${steps(item.q)}</details></article>`).join('')}</section></section>`;}

function render(){
  if(state.activeExam&&now()>=state.activeExam.deadline){finishExam('timeout');return;}
  chrome();if(state.activeExam&&route.view!=='exam')$('#view').innerHTML=pageTop('EXAM IN PROGRESS')+`<div class="card empty">${icon('lock-keyhole')}<h1 class="page-title">One thing at a time.</h1><p>Study materials unlock after you finish this attempt.<br>Your timer is still running.</p><a class="button primary" href="#exam">Return to exam ${icon('arrow-right')}</a></div>`;
  else $('#view').innerHTML=route.view==='theory'?renderTheory():route.view==='practice'?renderPractice():route.view==='exam'?renderExam():renderRevision();math();tick();
}
function navigate(){const parts=location.hash.replace(/^#/,'').split('/');const view=['theory','practice','exam','formulas','cheat'].includes(parts[0])?parts[0]:'theory';route={view,chapter:integer(Number(parts[1]),0,14)?Number(parts[1]):(route.chapter||0)};if(view==='practice'&&parts[1]!==undefined&&integer(Number(parts[1]),0,14)){practice.chapter=parts[1];practice.qid=null;}
  if(view==='exam'&&['full','quick'].includes(parts[1])&&/^[a-zA-Z0-9_-]{1,32}$/.test(parts[2]||'')){shared={mode:parts[1],seed:parts[2],minutes:[60,75,90].includes(Number(parts[3]))?Number(parts[3]):75};}
  render();window.scrollTo({top:0,behavior:'instant'});
}
function tick(){if(!state.activeExam)return;const remaining=state.activeExam.deadline-now();if(remaining<=0){finishExam('timeout');return;}const el=$('#timer');if(el){const sec=Math.ceil(remaining/1000);el.textContent=`${pad(Math.floor(sec/60))}:${pad(sec%60)}`;el.classList.toggle('urgent',remaining<5*60000);el.setAttribute('aria-label',`${Math.floor(sec/60)} minutes ${sec%60} seconds remaining`);}}
function dialog(title,body){$('#modal-content').innerHTML=`<div class="dialog-head"><h2>${title}</h2><button class="icon-button" data-action="close-modal" aria-label="Close dialog">${icon('x')}</button></div>${body}`;if(!$('#modal').open)$('#modal').showModal();math();}
function pdfPage(page){return page>=408?page+21:page+23;}
function openBook(page=1){if(state.activeExam){toast('Book links unlock when the exam finishes.');return;}bookTarget=page;dialog('Read in your textbook',`<div class="dialog-section"><div class="book-reference"><div class="source-cover">G / P <span>3e</span></div><div><strong>Discrete Mathematics with Graph Theory</strong>Edgar G. Goodaire & Michael M. Parmenter · 3rd edition<br>Printed page ${page} → PDF page ${pdfPage(page)}</div></div><p>Connect your own copy of the supplied PDF. It opens locally and is never uploaded. Reconnect it after reloading this page.</p>${ru('Выберите исходный учебник на своём устройстве. Ссылка откроет нужную PDF-страницу. В исходном файле отсутствуют печатные страницы 406–407; смещение учтено.')}<div class="dialog-actions">${bookURL?`<a class="button primary" href="${esc(bookURL)}#page=${pdfPage(page)}" target="_blank" rel="noopener">Open PDF at page ${pdfPage(page)} ${icon('external-link')}</a>`:''}<button class="button" data-action="connect-book">${icon('file-up')}${bookURL?'Replace PDF':'Choose textbook PDF'}</button></div>${bookURL?`<p>Connected: ${esc(bookName)}</p>`:''}<p class="subtle">Page links depend on your browser’s PDF viewer. If it opens at the cover, enter PDF page ${pdfPage(page)} in its page control. The textbook itself is not included in the public lab.</p></div>`);}
function showSettings(){if(state.activeExam){toast('Progress tools are available after the exam.');return;}const s=practiceStats();dialog('Your study space',`<div class="dialog-section"><h3>Progress on this browser</h3><p>${s.solved} independently solved · ${s.xp} XP · ${state.read.length}/15 chapters read · ${state.exams.length} exam attempts</p><p>Exports contain your progress and preferences, not the textbook. Import replaces current progress after validation. Keep a backup before changing devices.</p><div class="dialog-actions"><button class="button" data-action="export">${icon('download')} Export JSON</button><button class="button" data-action="import">${icon('upload')} Import JSON</button><button class="button danger" data-action="reset">Reset progress</button></div></div><div class="dialog-section"><h3>Your textbook</h3><p>Goodaire & Parmenter, 3rd edition. Original summaries and original practice questions follow chapters 0–14. Propositional / Boolean laws are covered in chapter 1; the book has no separate Boolean Algebra chapter.</p><button class="button" data-action="book" data-page="1">${icon('book-open')} Connect your PDF</button><p>Printed pp. 406–407 are missing from the supplied scan. The app adjusts page links after this gap.</p></div><div class="dialog-section"><h3>Independent study, open access</h3><p>No account, backend, analytics, or paid API. Progress is stored with LocalStorage on this browser and site address. Formula rendering, icons, and celebration effects load from version-pinned CDNs; an internet connection is needed for those assets. A text fallback keeps the exercises usable if they fail.</p><p>Practice accuracy includes all submitted practice attempts. XP rewards each independently solved question once (Easy 10, Medium 20, Hard 30). Guided solutions do not earn XP. Exam history retains the latest 30 attempts. ${BANK_VERSION}</p></div>`);}
function shareDialog(group=false){const seed=state.activeExam?.seed||shared?.seed||newSeed();const mode=state.activeExam?.mode||shared?.mode||'full';const minutes=mode==='quick'?10:state.activeExam?Math.round((state.activeExam.deadline-state.activeExam.startedAt)/60000):Number($('#exam-duration')?.value||shared?.minutes||75);if(group)shared={mode,seed,minutes};const base=location.href.split('#')[0].split('?')[0];const link=group?`${base}#exam/${mode}/${seed}/${minutes}`:`${base}#theory`;dialog(group?'An exam for your study group':'Good ideas are better shared',`<div class="dialog-section"><p>${group?`Same questions, same order. ${mode==='full'?'20 questions across all chapters':'5 questions'} · ${minutes} minutes. Each student starts their own timer; results stay on their own device.`:'Send the lab to your classmates. Their progress stays separate from yours.'}</p>${location.protocol==='file:'?'<p class="feedback incorrect">This is a local file. Publish index.html first; then share its public URL.</p>':''}<label class="field-label" for="share-url">${group?'Group exam link':'Lab link'}</label><input id="share-url" type="text" style="width:100%" readonly value="${esc(link)}"><div class="dialog-actions"><button class="button primary" data-action="copy-link">${icon('copy')} Copy link</button>${!group?'<button class="button" data-action="share-group">Create group exam link</button>':''}</div></div>`);}
async function copyLink(){const input=$('#share-url');try{await navigator.clipboard.writeText(input.value);toast('Link copied. Ready for your group.');}catch(error){input.focus();input.select();toast('Select and copy this link with your browser’s Copy command.');}}
function exportProgress(){const data={...state,exportedAt:new Date().toISOString()};const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='discrete-lab-progress.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Progress exported.');}
function confirmSubmit(){if(!state.activeExam)return;const n=state.activeExam.ids.filter(id=>!state.activeExam.answers[id]?.trim()).length;dialog('Finish this attempt?',`<div class="dialog-section"><p>${n?`${n} questions are unanswered and will count as incorrect.`:'All questions have an answer.'} Your timer is still running. Submitting unlocks your score and all solutions.</p><div class="dialog-actions"><button class="button primary" data-action="confirm-submit">Submit & see results</button><button class="button" data-action="close-modal">Keep working</button></div></div>`);}
document.addEventListener('click',event=>{const button=event.target.closest('[data-action]');if(!button||button.disabled)return;const action=button.dataset.action;
  if(state.activeExam&&['read','hint','check','next-question','difficulty','report','export','import','reset','confirm-reset','connect-book'].includes(action)){toast('Finish your exam to unlock study tools.');return;}
  switch(action){case 'chapter':location.hash=`#theory/${button.dataset.id}`;break;case 'read':{const id=Number(button.dataset.id);state.read=state.read.includes(id)?state.read.filter(n=>n!==id):[...state.read,id];persist();render();break;}case 'book':openBook(Number(button.dataset.page));break;case 'connect-book':$('#book-file').click();break;case 'check':checkPractice();break;case 'hint':if(!practice.checked&&practice.hints<3){practice.hints++;if(practice.hints===3){const q=byId.get(practice.qid),r=state.practice[q.id]||{attempts:0,correct:0,solved:false,assisted:false};state.practice[q.id]={...r,assisted:true,updatedAt:now()};persist();}render();}break;case 'next-question':chooseQuestion();render();break;case 'difficulty':practice.level=button.dataset.level;chooseQuestion();render();break;case 'start-exam':examStart(button.dataset.mode);break;case 'exam-go':if(state.activeExam){const index=Number(button.dataset.index);if(integer(index,0,state.activeExam.ids.length-1)){state.activeExam.index=index;persist();render();}}break;case 'submit-exam':confirmSubmit();break;case 'confirm-submit':finishExam();break;case 'close-modal':$('#modal').close();break;case 'share-group':shareDialog(true);break;case 'copy-link':copyLink();break;case 'print':window.print();break;case 'export':exportProgress();break;case 'import':$('#import-file').click();break;case 'reset':dialog('Reset your progress?',`<div class="dialog-section"><p>This removes practice records, read chapters, XP, and exam history from this browser. Your theme and language preferences stay. Export a backup first if you may want these records later.</p><div class="dialog-actions"><button class="button" data-action="export">Export backup</button><button class="button danger" data-action="confirm-reset">Reset all progress</button><button class="button" data-action="close-modal">Cancel</button></div></div>`);break;case 'confirm-reset':{const prefs=state.prefs;state=defaultState();state.prefs=prefs;practice.qid=null;persist();$('#modal').close();render();toast('Progress reset. A fresh start.');break;}case 'report':{const exam=state.exams.find(e=>e.id===button.dataset.id);if(exam){$('#view').innerHTML=pageTop('PAST EXAM REVIEW')+`<a class="text-button" href="#exam" data-action="exam-home">← Back to simulator</a>`+renderReport(exam);math();window.scrollTo({top:0,behavior:'instant'});}break;}case 'exam-home':render();break;}
});
function captureAnswer(value){if(state.activeExam){if(now()>=state.activeExam.deadline){finishExam('timeout');return;}const id=state.activeExam.ids[state.activeExam.index];state.activeExam.answers[id]=value;persist();const nav=$(`.question-nav [data-index="${state.activeExam.index}"]`);if(nav){nav.classList.toggle('answered',!!value.trim());nav.setAttribute('aria-label',`Question ${state.activeExam.index+1}${value.trim()?', answered':''}`);}const count=$('#answered-count');if(count)count.textContent=`${state.activeExam.ids.filter(qid=>state.activeExam.answers[qid]?.trim()).length} / ${state.activeExam.ids.length} answered`;}else if(route.view==='practice'&&!practice.checked&&practice.hints<3)practice.answer=value;}
document.addEventListener('input',event=>{if(event.target.id==='answer-input')captureAnswer(event.target.value);if(event.target.id==='search'){filter.query=event.target.value;$('#revision-results').innerHTML=route.view==='formulas'?formulaResults():cheatResults();math();}});
document.addEventListener('change',event=>{const el=event.target;if(el.name==='answer')captureAnswer(el.value);if(el.id==='practice-chapter'){practice.chapter=el.value;chooseQuestion();render();}if(el.id==='unsolved'){practice.onlyUnsolved=el.checked;chooseQuestion();render();}if(el.id==='chapter-mobile')location.hash=`#theory/${el.value}`;if(el.id==='filter-chapter'){filter.chapter=el.value;render();}});
document.addEventListener('keydown',event=>{if(event.key==='Enter'&&event.target.id==='answer-input'&&route.view==='practice'&&!state.activeExam){event.preventDefault();checkPractice();}});
$('#ru-toggle').addEventListener('click',()=>{state.prefs.ru=!state.prefs.ru;persist();render();if($('#modal').open)$('#modal').close();});
$('#theme-toggle').addEventListener('click',()=>{state.prefs.theme=state.prefs.theme==='light'?'dark':'light';persist();applyPrefs();math();});
$('#settings').addEventListener('click',showSettings);$('#share').addEventListener('click',()=>shareDialog());
$('#book-file').addEventListener('change',event=>{const file=event.target.files?.[0];if(!file)return;if(!/\.pdf$/i.test(file.name)){toast('Choose a PDF file.');return;}if(bookURL)URL.revokeObjectURL(bookURL);bookURL=URL.createObjectURL(file);bookName=file.name;event.target.value='';openBook(bookTarget);});
$('#import-file').addEventListener('change',async event=>{const file=event.target.files?.[0];event.target.value='';if(!file)return;try{if(file.size>2*1024*1024)throw Error('File exceeds the 2 MB limit.');const imported=validateState(JSON.parse(await file.text()));window.pendingImport=imported;dialog('Replace progress with this backup?',`<div class="dialog-section"><p>The backup is valid: ${Object.keys(imported.practice).length} practice records, ${imported.read.length} read chapters, ${imported.exams.length} exam attempts${imported.activeExam?', and one running exam whose clock continues':''}. Import replaces the current records.</p><div class="dialog-actions"><button class="button primary" id="confirm-import">Import & replace</button><button class="button" data-action="close-modal">Cancel</button></div></div>`);$('#confirm-import').onclick=()=>{state=imported;delete window.pendingImport;persist();practice.qid=null;$('#modal').close();if(state.activeExam)location.hash='#exam';render();toast('Progress imported.');};}catch(error){toast('Import rejected: '+error.message);}});
window.addEventListener('hashchange',navigate);document.addEventListener('visibilitychange',tick);window.addEventListener('pageshow',tick);
// Avoid silently overwriting progress if another tab modifies the same study lab.
window.addEventListener('storage',event=>{if(event.key===STORAGE_KEY&&event.newValue){try{state=validateState(JSON.parse(event.newValue));render();toast('Progress refreshed from another tab.');}catch(error){toast('Another tab wrote incompatible progress; this tab kept its current state.');}}});
// Render immediately; slow or unavailable CDN assets must not block studying.
navigate();if(state.activeExam){location.hash='#exam';tick();}setInterval(tick,1000);
document.addEventListener('DOMContentLoaded',()=>{math();if(loadWarning)toast(loadWarning);else if(!window.renderMathInElement)toast('Math renderer is unavailable. Formulas are shown as TeX; reconnect and reload for typesetting.');});

</script>
</body>
</html>
