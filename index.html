wer":"4","hints":["Group numbers by their absolute values.","Zero forms a class by itself."],"ruHints":["Сгруппируйте числа по модулю.","Ноль образует отдельный класс."],"steps":["The classes are $\\{0\\}$, $\\{-1,1\\}$, $\\{-2,2\\}$, and $\\{-3,3\\}$.","They are disjoint and cover $A$, giving $4$ classes."],"ruSteps":["Классы: $\\{0\\}$, $\\{-1,1\\}$, $\\{-2,2\\}$ и $\\{-3,3\\}$.","Они не пересекаются и покрывают $A$; всего $4$ класса."],"section":"2.4","page":58},{"id":"c2-m2","chapter":2,"level":"Medium","type":"text","prompt":"Order $A=\\{1,2,3,4,6,12,18\\}$ by divisibility. List all maximal elements in increasing order, separated by commas (example: 2,7).","ruPrompt":"Множество $A=\\{1,2,3,4,6,12,18\\}$ упорядочено делимостью. Перечислите все максимальные элементы по возрастанию через запятую (пример: 2,7).","options":[],"answer":"12,18","hints":["Maximal means there is no different element of the set above it.","Check whether each number divides a larger member of this particular set."],"ruHints":["У максимального элемента нет другого элемента множества выше него.","Проверьте, делит ли число какой-либо больший элемент именно этого множества."],"steps":["$1,2,3,4,6$ each divide another member of $A$, so none is maximal.","Neither $12$ nor $18$ divides another distinct member of $A$.","Thus the maximal elements are $12,18$; there is no greatest element."],"ruSteps":["$1,2,3,4,6$ делят другие элементы $A$, поэтому не максимальны.","Ни $12$, ни $18$ не делит другой отличный от себя элемент $A$.","Максимальные элементы — $12,18$; наибольшего элемента нет."],"section":"2.5","page":64,"aliases":["12, 18"]},{"id":"c2-h1","chapter":2,"level":"Hard","type":"number","prompt":"Let $R=\\{(a,b),(b,c),(c,a),(c,d)\\}$ on $\\{a,b,c,d\\}$. How many ordered pairs belong to the smallest transitive relation containing $R$? Do not require reflexivity separately.","ruPrompt":"Пусть $R=\\{(a,b),(b,c),(c,a),(c,d)\\}$ на $\\{a,b,c,d\\}$. Сколько упорядоченных пар в наименьшем транзитивном отношении, содержащем $R$? Отдельно требовать рефлексивность не нужно.","options":[],"answer":"12","hints":["A pair belongs to the transitive closure if there is a directed walk of positive length.","The first three vertices form a cycle, while $d$ has no outgoing edge."],"ruHints":["В транзитивном замыкании есть пара, если существует направленный маршрут положительной длины.","Первые три вершины образуют цикл; из $d$ рёбер нет."],"steps":["Each of $a,b,c$ reaches all three of $a,b,c$, including itself by a full cycle: $3\\cdot3=9$ pairs.","Each of $a,b,c$ also reaches $d$: $3$ additional pairs.","No positive-length directed walk starts at $d$, so there are no pairs with first entry $d$.","The total is $9+3=12$."],"ruSteps":["Из каждой из $a,b,c$ достижимы все $a,b,c$, включая саму вершину по циклу: $3\\cdot3=9$ пар.","Из каждой из $a,b,c$ достижима $d$: ещё $3$ пары.","Из $d$ не начинается направленный маршрут положительной длины, поэтому пар с первым элементом $d$ нет.","Итого $9+3=12$."],"section":"2.3","page":51},{"id":"c2-h2","chapter":2,"level":"Hard","type":"number","prompt":"How many equivalence relations on the labeled set $\\{a,b,c,d\\}$ have exactly two equivalence classes?","ruPrompt":"Сколько отношений эквивалентности на множестве $\\{a,b,c,d\\}$ имеют ровно два класса?","options":[],"answer":"7","hints":["Equivalence relations correspond to partitions into nonempty blocks.","The possible block sizes are 1+3 and 2+2; the blocks are not ordered."],"ruHints":["Эквивалентности соответствуют разбиениям на непустые блоки.","Размеры блоков: 1+3 или 2+2; порядок блоков не важен."],"steps":["For sizes $1+3$, choose the singleton in $4$ ways.","For sizes $2+2$, the partner of $a$ can be $b,c,$ or $d$, giving $3$ partitions.","The cases are disjoint, so there are $4+3=7$ relations."],"ruSteps":["При размерах $1+3$ одноэлементный блок выбирается $4$ способами.","При размерах $2+2$ партнёром $a$ может быть $b,c$ или $d$, что даёт $3$ разбиения.","Случаи не пересекаются; всего $4+3=7$ отношений."],"section":"2.4","page":57},{"id":"c3-e1","chapter":3,"level":"Easy","type":"mcq","prompt":"Classify $f:\\mathbb Z\\to\\mathbb Z$, $f(n)=2n+1$.","ruPrompt":"Определите свойства $f:\\mathbb Z\\to\\mathbb Z$, $f(n)=2n+1$.","options":["Bijective","Injective but not surjective","Surjective but not injective","Neither injective nor surjective"],"answer":"Injective but not surjective","hints":["Can two inputs have the same output?","Which integers never occur as outputs?"],"ruHints":["Могут ли два разных аргумента дать один результат?","Какие целые числа не могут быть результатами?"],"steps":["$2a+1=2b+1$ implies $a=b$, so $f$ is injective.","Every output is odd, so no even integer is reached; $f$ is not surjective onto $\\mathbb Z$."],"ruSteps":["Из $2a+1=2b+1$ следует $a=b$, поэтому $f$ инъективна.","Все значения нечётные; чётные целые не достигаются, поэтому сюръективности на $\\mathbb Z$ нет."],"section":"3.1","page":72},{"id":"c3-e2","chapter":3,"level":"Easy","type":"number","prompt":"For the bijection $f:\\mathbb R\\to\\mathbb R$ defined by $f(x)=3x-4$, find $f^{-1}(11)$.","ruPrompt":"Для биекции $f:\\mathbb R\\to\\mathbb R$, $f(x)=3x-4$, найдите $f^{-1}(11)$.","options":[],"answer":"5","hints":["The inverse asks which input produces 11.","Solve $3x-4=11$."],"ruHints":["Обратная функция спрашивает, какой аргумент даёт 11.","Решите $3x-4=11$."],"steps":["Solve $3x-4=11$, giving $3x=15$ and $x=5$.","Hence $f^{-1}(11)=5$."],"ruSteps":["Из $3x-4=11$ получаем $3x=15$, откуда $x=5$.","Следовательно, $f^{-1}(11)=5$."],"section":"3.2","page":80},{"id":"c3-m1","chapter":3,"level":"Medium","type":"number","prompt":"Let $f(x)=x^2+1$ and $g(x)=2x-3$ on $\\mathbb R$. Find $(g\\circ f)(-2)$.","ruPrompt":"Пусть $f(x)=x^2+1$ и $g(x)=2x-3$ на $\\mathbb R$. Найдите $(g\\circ f)(-2)$.","options":[],"answer":"7","hints":["In $g\\circ f$, apply $f$ first.","Compute $f(-2)$, then use that result as the input of $g$."],"ruHints":["В $g\\circ f$ сначала применяется $f$.","Вычислите $f(-2)$ и подставьте результат в $g$."],"steps":["$f(-2)=(-2)^2+1=5$.","Then $g(5)=2\\cdot5-3=7$."],"ruSteps":["$f(-2)=(-2)^2+1=5$.","Затем $g(5)=2\\cdot5-3=7$."],"section":"3.2","page":84},{"id":"c3-m2","chapter":3,"level":"Medium","type":"mcq","prompt":"What is the cardinality of $\\mathbb N\\times\\mathbb N$, with $\\mathbb N=\\{1,2,3,\\ldots\\}$? ","ruPrompt":"Какова мощность $\\mathbb N\\times\\mathbb N$, где $\\mathbb N=\\{1,2,3,\\ldots\\}$?","options":["Finite","Countably infinite","Uncountable, same cardinality as the real numbers","Uncountable, strictly larger than the real numbers"],"answer":"Countably infinite","hints":["Imagine a grid of ordered pairs.","List pairs by increasing sum of their coordinates."],"ruHints":["Представьте сетку упорядоченных пар.","Перечисляйте пары по возрастанию суммы координат."],"steps":["Enumerate $(1,1)$, then the pairs of sum $3$, then sum $4$, and so on.","Each diagonal is finite and every pair occurs on one diagonal, producing an enumeration.","The set is infinite and countable."],"ruSteps":["Перечислите $(1,1)$, затем пары с суммой $3$, затем с суммой $4$ и далее.","Каждая диагональ конечна и любая пара находится на одной из них, поэтому получается перечисление.","Множество бесконечно и счётно."],"section":"3.3","page":88},{"id":"c3-h1","chapter":3,"level":"Hard","type":"number","prompt":"Let $|A|=3$ and $|B|=5$. How many ordered pairs of functions $(f,g)$ with $f:A\\to B$, $g:B\\to A$ satisfy $g\\circ f=\\operatorname{id}_A$?","ruPrompt":"Пусть $|A|=3$ и $|B|=5$. Сколько упорядоченных пар функций $(f,g)$, где $f:A\\to B$, $g:B\\to A$, удовлетворяют $g\\circ f=\\operatorname{id}_A$?","options":[],"answer":"540","hints":["The identity condition forces $f$ to be injective.","Once $f$ is fixed, values of $g$ on its image are forced; values elsewhere are free."],"ruHints":["Условие тождественности заставляет $f$ быть инъективной.","При фиксированной $f$ значения $g$ на её образе заданы, а вне образа свободны."],"steps":["If $f(a)=f(a^\\prime)$, applying $g$ gives $a=a^\\prime$, so $f$ is injective.","There are $5\\cdot4\\cdot3=60$ injective choices of $f$.","For each $f$, $g(f(a))=a$ fixes $g$ on three elements of $B$.","The remaining two elements each have $3$ choices, giving $3^2=9$ functions $g$.","Total: $60\\cdot9=540$."],"ruSteps":["Если $f(a)=f(a^\\prime)$, применение $g$ даёт $a=a^\\prime$, значит $f$ инъективна.","Инъекций $f$ существует $5\\cdot4\\cdot3=60$.","Условие $g(f(a))=a$ фиксирует $g$ на трёх элементах $B$.","На двух остальных элементах есть по $3$ варианта, то есть $3^2=9$ функций $g$.","Всего $60\\cdot9=540$."],"section":"3.2","page":84},{"id":"c3-h2","chapter":3,"level":"Hard","type":"mcq","prompt":"Let $f:A\\to B$ and $g:B\\to C$. If $g\\circ f$ is bijective, which properties must hold?","ruPrompt":"Пусть $f:A\\to B$ и $g:B\\to C$. Если $g\\circ f$ — биекция, какие свойства обязательны?","options":["$f$ and $g$ are both bijective","$f$ is surjective and $g$ is injective","$f$ is injective and $g$ is surjective","$f$ and $g$ are both injective"],"answer":"$f$ is injective and $g$ is surjective","hints":["Use injectivity of the composition on two inputs with the same $f$-value.","Use surjectivity of the composition for an arbitrary element of $C$."],"ruHints":["Примените инъективность композиции к аргументам с одинаковым значением $f$.","Примените сюръективность композиции к произвольному элементу $C$."],"steps":["If $f(a)=f(a^\\prime)$, then $(g\\circ f)(a)=(g\\circ f)(a^\\prime)$; injectivity gives $a=a^\\prime$.","For every $c\\in C$, surjectivity gives an $a\\in A$ with $g(f(a))=c$, so $g$ is surjective.","The other two properties need not hold: take $A=C=\\{0\\}$, $B=\\{0,1\\}$, $f(0)=0$, and $g(0)=g(1)=0$."],"ruSteps":["Из $f(a)=f(a^\\prime)$ следует $(g\\circ f)(a)=(g\\circ f)(a^\\prime)$; инъективность даёт $a=a^\\prime$.","Для каждого $c\\in C$ найдётся $a\\in A$ с $g(f(a))=c$, значит $g$ сюръективна.","Другие свойства не обязательны: возьмём $A=C=\\{0\\}$, $B=\\{0,1\\}$, $f(0)=0$ и $g(0)=g(1)=0$."],"section":"3.2","page":84},{"id":"c4-e1","chapter":4,"level":"Easy","type":"number","prompt":"What is the remainder when $-47$ is divided by $6$, using $-47=6q+r$ with $0\\le r<6$?","ruPrompt":"Найдите остаток от деления $-47$ на $6$: $-47=6q+r$, где $0\\le r<6$.","options":[],"answer":"1","hints":["The standard remainder must be nonnegative.","Choose a multiple of 6 just below or equal to -47."],"ruHints":["Стандартный остаток должен быть неотрицательным.","Возьмите кратное 6, ближайшее снизу к -47."],"steps":["$-47=6(-8)+1$.","Since $0\\le1<6$, the required remainder is $1$."],"ruSteps":["$-47=6(-8)+1$.","Поскольку $0\\le1<6$, остаток равен $1$."],"section":"4.1","page":98},{"id":"c4-e2","chapter":4,"level":"Easy","type":"number","prompt":"Find $\\gcd(84,30)$.","ruPrompt":"Найдите $\\gcd(84,30)$.","options":[],"answer":"6","hints":["Use the Euclidean algorithm.","Replace a pair by the smaller number and the remainder."],"ruHints":["Используйте алгоритм Евклида.","Заменяйте пару меньшим числом и остатком."],"steps":["$84=2\\cdot30+24$, $30=1\\cdot24+6$, $24=4\\cdot6$.","The last nonzero remainder is $6$, hence $\\gcd(84,30)=6$."],"ruSteps":["$84=2\\cdot30+24$, $30=1\\cdot24+6$, $24=4\\cdot6$.","Последний ненулевой остаток равен $6$, поэтому $\\gcd(84,30)=6$."],"section":"4.2","page":105},{"id":"c4-m1","chapter":4,"level":"Medium","type":"number","prompt":"Find the multiplicative inverse of $7$ modulo $26$ in the range $0\\le x<26$.","ruPrompt":"Найдите обратный элемент к $7$ по модулю $26$ в диапазоне $0\\le x<26$.","options":[],"answer":"15","hints":["Solve $7x\\equiv1\\pmod{26}$.","Use the Euclidean algorithm and work backwards."],"ruHints":["Решите $7x\\equiv1\\pmod{26}$.","Используйте алгоритм Евклида и обратную подстановку."],"steps":["$26=3\\cdot7+5$, $7=5+2$, $5=2\\cdot2+1$.","Back substitution gives $1=3\\cdot26-11\\cdot7$.","Thus $x\\equiv-11\\equiv15\\pmod{26}$; check $7\\cdot15=105=4\\cdot26+1$."],"ruSteps":["$26=3\\cdot7+5$, $7=5+2$, $5=2\\cdot2+1$.","Обратная подстановка даёт $1=3\\cdot26-11\\cdot7$.","Значит $x\\equiv-11\\equiv15\\pmod{26}$; проверка: $7\\cdot15=105=4\\cdot26+1$."],"section":"4.4","page":125},{"id":"c4-m2","chapter":4,"level":"Medium","type":"number","prompt":"Find the least nonnegative solution of $6x\\equiv9\\pmod{15}$.","ruPrompt":"Найдите наименьшее неотрицательное решение $6x\\equiv9\\pmod{15}$.","options":[],"answer":"4","hints":["The coefficient and modulus have a common factor.","Divide the coefficient, right side, and modulus by 3."],"ruHints":["У коэффициента и модуля есть общий делитель.","Разделите коэффициент, правую часть и модуль на 3."],"steps":["$15\\mid(6x-9)$ is equivalent to $5\\mid(2x-3)$.","Thus $2x\\equiv3\\pmod5$, so $x\\equiv4\\pmod5$.","The residues modulo $15$ are $4,9,14$; the smallest is $4$."],"ruSteps":["$15\\mid(6x-9)$ равносильно $5\\mid(2x-3)$.","Получаем $2x\\equiv3\\pmod5$, откуда $x\\equiv4\\pmod5$.","Вычеты по модулю $15$: $4,9,14$; наименьший — $4$."],"section":"4.4","page":125},{"id":"c4-h1","chapter":4,"level":"Hard","type":"number","prompt":"Find the least positive integer $x$ satisfying $x\\equiv2\\pmod5$, $x\\equiv3\\pmod7$, and $x\\equiv4\\pmod9$.","ruPrompt":"Найдите наименьшее положительное целое $x$, удовлетворяющее $x\\equiv2\\pmod5$, $x\\equiv3\\pmod7$ и $x\\equiv4\\pmod9$.","options":[],"answer":"157","hints":["Write $x=5a+2$ and use the congruence modulo 7 first.","Combine the first two conditions as $x=35b+17$, then work modulo 9."],"ruHints":["Запишите $x=5a+2$ и сначала используйте сравнение по модулю 7.","Объедините первые два условия в $x=35b+17$, затем используйте модуль 9."],"steps":["$5a+2\\equiv3\\pmod7$ gives $5a\\equiv1$, hence $a\\equiv3\\pmod7$.","Writing $a=7b+3$ gives $x=35b+17$.","Modulo $9$, $8b+8\\equiv4$, so $8b\\equiv5$ and $b\\equiv4\\pmod9$.","Thus $x=315t+157$. The least positive value is $157$, which has remainders $2,3,4$ respectively."],"ruSteps":["$5a+2\\equiv3\\pmod7$ даёт $5a\\equiv1$, откуда $a\\equiv3\\pmod7$.","Подстановка $a=7b+3$ даёт $x=35b+17$.","По модулю $9$: $8b+8\\equiv4$, то есть $8b\\equiv5$ и $b\\equiv4\\pmod9$.","Поэтому $x=315t+157$. Наименьшее положительное значение — $157$, с нужными остатками $2,3,4$."],"section":"4.5","page":139},{"id":"c4-h2","chapter":4,"level":"Hard","type":"number","prompt":"Find the remainder of $7^{73}$ upon division by $1000$.","ruPrompt":"Найдите остаток от деления $7^{73}$ на $1000$.","options":[],"answer":"407","hints":["Use modular exponentiation; do not expand the full power.","Compute $7^{10}$ and $7^{20}$ modulo $1000$, then reduce the exponent."],"ruHints":["Используйте возведение в степень по модулю, не вычисляя полное число.","Вычислите $7^{10}$ и $7^{20}$ по модулю $1000$, затем уменьшите показатель."],"steps":["$7^5\\equiv807\\pmod{1000}$, so $7^{10}\\equiv807^2\\equiv249\\pmod{1000}$.","$7^{20}\\equiv249^2=62001\\equiv1\\pmod{1000}$.","Since $73=3\\cdot20+13$, $7^{73}\\equiv7^{13}\\equiv249\\cdot49\\cdot7\\pmod{1000}$.","$249\\cdot49\\cdot7=85407$, so the remainder is $407$."],"ruSteps":["$7^5\\equiv807\\pmod{1000}$, значит $7^{10}\\equiv807^2\\equiv249\\pmod{1000}$.","$7^{20}\\equiv249^2=62001\\equiv1\\pmod{1000}$.","Так как $73=3\\cdot20+13$, имеем $7^{73}\\equiv7^{13}\\equiv249\\cdot49\\cdot7\\pmod{1000}$.","$249\\cdot49\\cdot7=85407$, поэтому остаток равен $407$."],"section":"4.4","page":125},{"id":"c5-e1","chapter":5,"level":"Easy","type":"mcq","prompt":"In an induction proof for every integer $n\\ge1$, what is the usual induction step?","ruPrompt":"Как выглядит обычный индукционный переход в доказательстве для всех целых $n\\ge1$?","options":["Assume $P(k)$ for an arbitrary $k\\ge1$ and prove $P(k+1)$.","Check $P(2)$ and $P(3)$ only.","Assume $P(n)$ for every $n$ and conclude $P(1)$.","Prove $P(1)$ without any further argument."],"answer":"Assume $P(k)$ for an arbitrary $k\\ge1$ and prove $P(k+1)$.","hints":["The base case and induction step have different roles.","The step must work for an arbitrary index, not just a chosen example."],"ruHints":["База и индукционный переход выполняют разные задачи.","Переход должен работать для произвольного индекса, а не для одного примера."],"steps":["After proving $P(1)$, assume $P(k)$ for an arbitrary integer $k\\ge1$.","Deduce $P(k+1)$ under that assumption; induction then proves all cases."],"ruSteps":["После доказательства $P(1)$ предположите $P(k)$ для произвольного целого $k\\ge1$.","При этом предположении докажите $P(k+1)$; индукция охватит все случаи."],"section":"5.1","page":147},{"id":"c5-e2","chapter":5,"level":"Easy","type":"number","prompt":"Let $a_0=2$ and $a_n=3a_{n-1}+1$ for $n\\ge1$. Find $a_2$.","ruPrompt":"Пусть $a_0=2$ и $a_n=3a_{n-1}+1$ при $n\\ge1$. Найдите $a_2$.","options":[],"answer":"22","hints":["Apply the recurrence once to find the first term.","Apply it again using that new value."],"ruHints":["Примените рекуррентную формулу для первого члена.","Примените её ещё раз к полученному значению."],"steps":["$a_1=3\\cdot2+1=7$.","$a_2=3\\cdot7+1=22$."],"ruSteps":["$a_1=3\\cdot2+1=7$.","$a_2=3\\cdot7+1=22$."],"section":"5.2","page":160},{"id":"c5-m1","chapter":5,"level":"Medium","type":"number","prompt":"Let $a_0=2$, $a_1=5$, and $a_n=5a_{n-1}-6a_{n-2}$ for $n\\ge2$. Find $a_5$.","ruPrompt":"Пусть $a_0=2$, $a_1=5$ и $a_n=5a_{n-1}-6a_{n-2}$ при $n\\ge2$. Найдите $a_5$.","options":[],"answer":"275","hints":["The characteristic polynomial is $r^2-5r+6$.","Its distinct roots are 2 and 3; determine the two constants from the initial values."],"ruHints":["Характеристический многочлен: $r^2-5r+6$.","Его различные корни — 2 и 3; найдите две константы из начальных условий."],"steps":["$r^2-5r+6=(r-2)(r-3)$, so $a_n=A2^n+B3^n$.","$A+B=2$ and $2A+3B=5$ give $A=B=1$.","Therefore $a_5=2^5+3^5=32+243=275$."],"ruSteps":["$r^2-5r+6=(r-2)(r-3)$, значит $a_n=A2^n+B3^n$.","Условия $A+B=2$ и $2A+3B=5$ дают $A=B=1$.","Поэтому $a_5=2^5+3^5=32+243=275$."],"section":"5.3","page":170},{"id":"c5-m2","chapter":5,"level":"Medium","type":"number","prompt":"Use the identity $\\sum_{i=1}^{n}(2i-1)=n^2$ to find $1+3+5+\\cdots+23$.","ruPrompt":"Используя тождество $\\sum_{i=1}^{n}(2i-1)=n^2$, найдите $1+3+5+\\cdots+23$.","options":[],"answer":"144","hints":["Identify how many odd summands there are.","Solve $2n-1=23$."],"ruHints":["Определите число нечётных слагаемых.","Решите $2n-1=23$."],"steps":["The final summand is $2n-1=23$, so $n=12$.","The identity gives a sum of $12^2=144$.","For its induction step, $k^2+(2k+1)=(k+1)^2$, with base case $1=1^2$."],"ruSteps":["Последнее слагаемое $2n-1=23$, поэтому $n=12$.","По тождеству сумма равна $12^2=144$.","Индукционный переход для тождества: $k^2+(2k+1)=(k+1)^2$; база: $1=1^2$."],"section":"5.1","page":147},{"id":"c5-h1","chapter":5,"level":"Hard","type":"number","prompt":"Let $a_0=1$, $a_1=6$, and $a_n=4a_{n-1}-4a_{n-2}$ for $n\\ge2$. Use the repeated characteristic root to find $a_6$.","ruPrompt":"Пусть $a_0=1$, $a_1=6$ и $a_n=4a_{n-1}-4a_{n-2}$ при $n\\ge2$. Используйте кратный характеристический корень, чтобы найти $a_6$.","options":[],"answer":"832","hints":["The characteristic polynomial is $(r-2)^2$.","A repeated root gives the form $a_n=(A+Bn)2^n$."],"ruHints":["Характеристический многочлен равен $(r-2)^2$.","Кратный корень даёт форму $a_n=(A+Bn)2^n$."],"steps":["$r^2-4r+4=(r-2)^2$, so $a_n=(A+Bn)2^n$.","$a_0=1$ gives $A=1$; $a_1=6$ gives $2(1+B)=6$, hence $B=2$.","Thus $a_6=(1+2\\cdot6)2^6=13\\cdot64=832$."],"ruSteps":["$r^2-4r+4=(r-2)^2$, поэтому $a_n=(A+Bn)2^n$.","Из $a_0=1$ следует $A=1$; из $a_1=6$ получаем $2(1+B)=6$, откуда $B=2$.","Следовательно, $a_6=(1+2\\cdot6)2^6=13\\cdot64=832$."],"section":"5.3","page":170},{"id":"c5-h2","chapter":5,"level":"Hard","type":"number","prompt":"Find the coefficient of $x^6$ in the formal power series $A(x)=\\frac{1}{(1-x)^2(1-2x)}$.","ruPrompt":"Найдите коэффициент при $x^6$ в формальном степенном ряде $A(x)=\\frac{1}{(1-x)^2(1-2x)}$.","options":[],"answer":"247","hints":["Use $(1-x)^{-2}=\\sum_{j\\ge0}(j+1)x^j$ and $(1-2x)^{-1}=\\sum_{k\\ge0}2^kx^k$.","For the coefficient of degree 6, combine terms whose degrees add to 6."],"ruHints":["Используйте $(1-x)^{-2}=\\sum_{j\\ge0}(j+1)x^j$ и $(1-2x)^{-1}=\\sum_{k\\ge0}2^kx^k$.","Для коэффициента степени 6 берите произведения членов с суммой степеней 6."],"steps":["The coefficient is $\\sum_{j=0}^{6}(j+1)2^{6-j}$.","This equals $64+64+48+32+20+12+7=247$.","As a check, $A(x)=\\frac4{1-2x}-\\frac2{1-x}-\\frac1{(1-x)^2}$, giving coefficient $4\\cdot2^6-2-7=247$."],"ruSteps":["Коэффициент равен $\\sum_{j=0}^{6}(j+1)2^{6-j}$.","Получаем $64+64+48+32+20+12+7=247$.","Проверка: $A(x)=\\frac4{1-2x}-\\frac2{1-x}-\\frac1{(1-x)^2}$, поэтому коэффициент равен $4\\cdot2^6-2-7=247$."],"section":"5.4","page":176},{"id":"c6-e1","chapter":6,"level":"Easy","type":"number","prompt":"If $|A|=18$, $|B|=15$, and $|A\\cap B|=7$, find $|A\\cup B|$.","ruPrompt":"Если $|A|=18$, $|B|=15$ и $|A\\cap B|=7$, найдите $|A\\cup B|$.","options":[],"answer":"26","hints":["Adding the sizes counts intersection elements twice.","Subtract the intersection once."],"ruHints":["При сложении мощностей элементы пересечения учитываются дважды.","Вычтите пересечение один раз."],"steps":["$|A\\cup B|=|A|+|B|-|A\\cap B|$.","Therefore $|A\\cup B|=18+15-7=26$."],"ruSteps":["$|A\\cup B|=|A|+|B|-|A\\cap B|$.","Значит $|A\\cup B|=18+15-7=26$."],"section":"6.1","page":184},{"id":"c6-e2","chapter":6,"level":"Easy","type":"number","prompt":"A meal uses exactly one of 3 starters, one of 4 main courses, and one of 2 drinks. How many meals are possible if every combination is allowed?","ruPrompt":"Обед включает ровно одну из 3 закусок, одно из 4 основных блюд и один из 2 напитков. Сколько обедов возможно, если разрешены все сочетания?","options":[],"answer":"24","hints":["The choices are made in three independent stages.","Use the multiplication rule."],"ruHints":["Выбор состоит из трёх независимых этапов.","Примените правило произведения."],"steps":["For each starter, there are $4\\cdot2=8$ main-course/drink choices.","With $3$ starters, the total is $3\\cdot4\\cdot2=24$."],"ruSteps":["Для каждой закуски есть $4\\cdot2=8$ сочетаний блюда и напитка.","При $3$ закусках получаем $3\\cdot4\\cdot2=24$."],"section":"6.2","page":192},{"id":"c6-m1","chapter":6,"level":"Medium","type":"number","prompt":"What is the smallest number of students that guarantees at least five were born on the same day of the week?","ruPrompt":"Какое наименьшее число студентов гарантирует, что хотя бы пятеро родились в один день недели?","options":[],"answer":"29","hints":["There are seven day-of-week categories.","How many students can you place with at most four per category?"],"ruHints":["Дней недели семь.","Сколько студентов можно распределить, имея не более четырёх в каждой категории?"],"steps":["It is possible to place $4$ students in each of the $7$ categories: $28$ total.","One more student forces some category to have at least $5$.","Thus $7(5-1)+1=29$ is both sufficient and minimal."],"ruSteps":["Можно распределить по $4$ студента на каждый из $7$ дней: всего $28$.","Ещё один студент заставляет одну категорию содержать хотя бы $5$ человек.","Поэтому $7(5-1)+1=29$ — достаточное и минимальное число."],"section":"6.3","page":199},{"id":"c6-m2","chapter":6,"level":"Medium","type":"number","prompt":"How many integers from $1$ through $120$, inclusive, are divisible by $4$ or by $6$?","ruPrompt":"Сколько целых чисел от $1$ до $120$ включительно делятся на $4$ или на $6$?","options":[],"answer":"40","hints":["Count the two sets of multiples separately.","Numbers divisible by both are multiples of the least common multiple."],"ruHints":["Сначала посчитайте кратные каждого числа отдельно.","Общие кратные делятся на наименьшее общее кратное."],"steps":["There are $\\lfloor120/4\\rfloor=30$ multiples of $4$ and $\\lfloor120/6\\rfloor=20$ multiples of $6$.","The overlap consists of multiples of $\\operatorname{lcm}(4,6)=12$, of which there are $10$.","Inclusion-exclusion gives $30+20-10=40$."],"ruSteps":["Кратных $4$ имеется $\\lfloor120/4\\rfloor=30$, кратных $6$ — $\\lfloor120/6\\rfloor=20$.","Пересечение — кратные $\\operatorname{lcm}(4,6)=12$, их $10$.","По включениям-исключениям: $30+20-10=40$."],"section":"6.1","page":184},{"id":"c6-h1","chapter":6,"level":"Hard","type":"number","prompt":"How many integers $n$ with $1\\le n\\le300$ satisfy $\\gcd(n,30)=1$?","ruPrompt":"Сколько целых $n$, где $1\\le n\\le300$, удовлетворяют $\\gcd(n,30)=1$?","options":[],"answer":"80","hints":["Such integers are divisible by none of 2, 3, and 5.","Apply inclusion-exclusion to the three sets of multiples."],"ruHints":["Такие числа не делятся ни на 2, ни на 3, ни на 5.","Примените включения-исключения к трём множествам кратных."],"steps":["The forbidden single-set counts are $150,100,60$.","The pairwise overlap counts for multiples of $6,10,15$ are $50,30,20$.","The triple overlap has $300/30=10$ elements.","The forbidden union has $150+100+60-50-30-20+10=220$ elements.","The desired complement has $300-220=80$ elements."],"ruSteps":["Числа элементов отдельных запрещённых множеств: $150,100,60$.","Парные пересечения — кратные $6,10,15$; их $50,30,20$.","Тройное пересечение содержит $300/30=10$ элементов.","В запрещённом объединении $150+100+60-50-30-20+10=220$ элементов.","В нужном дополнении $300-220=80$ элементов."],"section":"6.1","page":184},{"id":"c6-h2","chapter":6,"level":"Hard","type":"number","prompt":"How many length-6 strings over $\\{a,b,c\\}$ contain each of the three letters at least once?","ruPrompt":"Сколько строк длины 6 над алфавитом $\\{a,b,c\\}$ содержат каждую из трёх букв хотя бы один раз?","options":[],"answer":"540","hints":["Start with all strings and exclude those missing a letter.","A string missing two specified letters uses only the third letter."],"ruHints":["Начните со всех строк и исключите строки без какой-либо буквы.","Строка без двух заданных букв использует только третью букву."],"steps":["There are $3^6=729$ unrestricted strings.","For each missing letter, $2^6=64$ strings remain; subtract $3\\cdot64$.","For each of the three pairs of missing letters there is one constant string; add $3$.","No positive-length string misses all three letters. The answer is $729-192+3=540$."],"ruSteps":["Без ограничений имеется $3^6=729$ строк.","При отсутствии конкретной буквы остаётся $2^6=64$ строки; вычитаем $3\\cdot64$.","Для каждой из трёх пар отсутствующих букв есть одна постоянная строка; прибавляем $3$.","Строка положительной длины не может не содержать всех трёх букв. Ответ: $729-192+3=540$."],"section":"6.1","page":184},{"id":"c7-e1","chapter":7,"level":"Easy","type":"number","prompt":"From 8 students, a president, a secretary, and a treasurer are selected. No student may hold two roles. How many assignments are possible?","ruPrompt":"Из 8 студентов выбирают председателя, секретаря и казначея. Один студент не может занимать две должности. Сколько назначений возможно?","options":[],"answer":"336","hints":["The three positions are distinct, so order matters.","There are 8 choices for the first role, then 7, then 6."],"ruHints":["Три должности различны, поэтому порядок важен.","Для первой должности 8 вариантов, затем 7 и 6."],"steps":["The number is the permutation count $P(8,3)=8!/(8-3)!$.","Hence $8\\cdot7\\cdot6=336$."],"ruSteps":["Это число размещений $P(8,3)=8!/(8-3)!$.","Получаем $8\\cdot7\\cdot6=336$."],"section":"7.1","page":205},{"id":"c7-e2","chapter":7,"level":"Easy","type":"number","prompt":"Find the coefficient of $x^3$ in $(1+2x)^5$.","ruPrompt":"Найдите коэффициент при $x^3$ в $(1+2x)^5$.","options":[],"answer":"80","hints":["Choose which three factors supply a term containing x.","Each selected term also contributes a factor of 2."],"ruHints":["Выберите три множителя, из которых берётся член с x.","Каждый выбранный член также вносит множитель 2."],"steps":["The $x^3$ term is $\\binom53(2x)^3\\cdot1^2$.","Its coefficient is $10\\cdot8=80$."],"ruSteps":["Член с $x^3$ равен $\\binom53(2x)^3\\cdot1^2$.","Его коэффициент: $10\\cdot8=80$."],"section":"7.7","page":239},{"id":"c7-m1","chapter":7,"level":"Medium","type":"text","prompt":"A bag has 5 red and 4 blue balls, all distinct. Three are drawn uniformly without replacement. What is the probability of exactly two red balls? Enter a reduced fraction a/b.","ruPrompt":"В мешке 5 красных и 4 синих шара, все различимы. Равновероятно выбирают три шара без возвращения. Какова вероятность ровно двух красных? Введите несократимую дробь a/b.","options":[],"answer":"10/21","hints":["Count all three-element subsets of the nine balls.","Favorable choices contain two of the five red balls and one of the four blue balls."],"ruHints":["Посчитайте все трёхэлементные подмножества девяти шаров.","В благоприятном выборе два из пяти красных и один из четырёх синих шаров."],"steps":["The sample space has $\\binom93=84$ equally likely subsets.","The event has $\\binom52\\binom41=10\\cdot4=40$ subsets.","The probability is $40/84=10/21$."],"ruSteps":["Пространство исходов содержит $\\binom93=84$ равновероятных подмножества.","Благоприятных подмножеств $\\binom52\\binom41=10\\cdot4=40$.","Вероятность $40/84=10/21$."],"section":"7.3","page":216,"aliases":["10 / 21"]},{"id":"c7-m2","chapter":7,"level":"Medium","type":"number","prompt":"How many distinct arrangements can be made from all letters of BANANA?","ruPrompt":"Сколько различных перестановок можно составить из всех букв слова BANANA?","options":[],"answer":"60","hints":["There are six positions, but some letters repeat.","The multiplicities of A, N, and B are 3, 2, and 1."],"ruHints":["Позиций шесть, но некоторые буквы повторяются.","Кратности A, N и B равны 3, 2 и 1."],"steps":["If all letters were distinct, there would be $6!$ arrangements.","Permutations among the three A letters and among the two N letters do not change the word.","Thus the number is $6!/(3!2!1!)=720/12=60$."],"ruSteps":["Если бы все буквы различались, было бы $6!$ перестановок.","Перестановки трёх букв A и двух букв N не меняют слово.","Поэтому число равно $6!/(3!2!1!)=720/12=60$."],"section":"7.5","page":231},{"id":"c7-h1","chapter":7,"level":"Hard","type":"number","prompt":"How many permutations of $\\{1,2,3,4,5,6,7\\}$ have exactly two fixed points?","ruPrompt":"Сколько перестановок множества $\\{1,2,3,4,5,6,7\\}$ имеют ровно две неподвижные точки?","options":[],"answer":"924","hints":["First choose the two fixed positions.","The other five elements must form a derangement, so none of their positions is fixed."],"ruHints":["Сначала выберите две неподвижные позиции.","Оставшиеся пять элементов должны образовать беспорядок — без неподвижных позиций."],"steps":["The two fixed points can be chosen in $\\binom72=21$ ways.","The other five positions can be filled in $D_5=5!\\sum_{j=0}^{5}(-1)^j/j!$ ways.","$D_5=120-120+60-20+5-1=44$.","Therefore the number is $21\\cdot44=924$."],"ruSteps":["Две неподвижные точки выбираются $\\binom72=21$ способом.","Остальные пять позиций заполняются $D_5=5!\\sum_{j=0}^{5}(-1)^j/j!$ способами.","$D_5=120-120+60-20+5-1=44$.","Итого $21\\cdot44=924$."],"section":"7.6","page":236},{"id":"c7-h2","chapter":7,"level":"Hard","type":"number","prompt":"How many ordered integer quadruples $(x_1,x_2,x_3,x_4)$ satisfy $x_1+x_2+x_3+x_4=10$ and $0\\le x_i\\le4$ for every $i$?","ruPrompt":"Сколько упорядоченных целочисленных четвёрок $(x_1,x_2,x_3,x_4)$ удовлетворяют $x_1+x_2+x_3+x_4=10$ и $0\\le x_i\\le4$ для всех $i$?","options":[],"answer":"68","hints":["Count nonnegative solutions first, then exclude those with a coordinate at least 5.","For an offending coordinate, subtract 5 from it and count the remaining sum."],"ruHints":["Сначала посчитайте неотрицательные решения, затем исключите решения с координатой хотя бы 5.","Вычтите 5 из нарушающей ограничение координаты и посчитайте решения для оставшейся суммы."],"steps":["Without upper bounds, stars and bars gives $\\binom{13}{3}=286$ solutions.","For each specified $i$ with $x_i\\ge5$, subtracting 5 leaves sum 5, giving $\\binom83=56$ solutions; subtract $4\\cdot56$.","Two specified offending coordinates leave sum 0, giving one solution per pair; add $\\binom42=6$.","Three coordinates cannot all be at least 5 when the sum is 10.","The result is $286-224+6=68$."],"ruSteps":["Без верхних границ метод звёзд и перегородок даёт $\\binom{13}{3}=286$ решений.","Для заданного $i$ с $x_i\\ge5$ вычитание 5 оставляет сумму 5: $\\binom83=56$ решений; вычитаем $4\\cdot56$.","Две заданные нарушающие координаты оставляют сумму 0: по одному решению на пару; прибавляем $\\binom42=6$.","Три координаты не могут одновременно быть не меньше 5 при сумме 10.","Результат: $286-224+6=68$."],"section":"7.5","page":231},{"id":"c8-e1","chapter":8,"level":"Easy","type":"mcq","prompt":"Which requirement distinguishes an algorithm from an endless informal procedure?","ruPrompt":"Какое требование отличает алгоритм от бесконечной неформальной процедуры?","options":["It always uses a computer.","It terminates after finitely many unambiguous steps for every valid input.","It always has constant running time.","It never uses repetition."],"answer":"It terminates after finitely many unambiguous steps for every valid input.","hints":["Think about both the instructions and termination.","A valid input must eventually produce the specified output."],"ruHints":["Подумайте об однозначности инструкций и завершении.","Для каждого допустимого входа результат должен быть получен за конечное время."],"steps":["An algorithm gives precise instructions.","It must terminate for every input in its stated domain."],"ruSteps":["Алгоритм задаёт точные, однозначные инструкции.","Он должен завершаться для каждого входа из указанной области."],"section":"8.1","page":247},{"id":"c8-e2","chapter":8,"level":"Easy","type":"number","prompt":"An unsorted list contains 13 distinct numbers. A linear search compares a missing target with entries one at a time. How many equality comparisons are required?","ruPrompt":"В неотсортированном списке 13 различных чисел. Линейный поиск поочерёдно сравнивает элементы с отсутствующим числом. Сколько проверок равенства потребуется?","options":[],"answer":"13","hints":["No ordering information is available.","The target is absent, so the search cannot stop early."],"ruHints":["Информация о порядке элементов отсутствует.","Искомого числа нет, поэтому нельзя завершить поиск раньше."],"steps":["Every entry must be checked once.","There are 13 entries, hence 13 comparisons."],"ruSteps":["Нужно проверить каждый элемент ровно один раз.","Элементов 13, значит, потребуется 13 сравнений."],"section":"8.3","page":265},{"id":"c8-m1","chapter":8,"level":"Medium","type":"mcq","prompt":"An algorithm performs $4n^2+7n+9$ elementary operations. Which is its tight asymptotic order?","ruPrompt":"Алгоритм выполняет $4n^2+7n+9$ элементарных операций. Каков его точный асимптотический порядок?","options":["$\\Theta(1)$","$\\Theta(n)$","$\\Theta(n^2)$","$\\Theta(n^3)$"],"answer":"$\\Theta(n^2)$","hints":["Compare the growth rates of the three terms.","For positive n, the quadratic term gives a lower bound; all terms together give a constant multiple of it as an upper bound."],"ruHints":["Сравните скорости роста трёх слагаемых.","Квадратичный член задаёт нижнюю оценку, а вся сумма сверху ограничена его постоянным множителем."],"steps":["For $n\\ge1$, $4n^2\\le4n^2+7n+9\\le20n^2$.","The function is bounded above and below by positive multiples of $n^2$, so it is $\\Theta(n^2)$."],"ruSteps":["При $n\\ge1$: $4n^2\\le4n^2+7n+9\\le20n^2$.","Функция ограничена сверху и снизу положительными кратными $n^2$, поэтому порядок равен $\\Theta(n^2)$."],"section":"8.2","page":253},{"id":"c8-m2","chapter":8,"level":"Medium","type":"text","prompt":"Permutations of 1, 2, 3, 4 are listed in lexicographic order. What permutation immediately follows 2413? Enter four digits without separators.","ruPrompt":"Перестановки 1, 2, 3, 4 перечислены в лексикографическом порядке. Какая перестановка идёт сразу после 2413? Введите четыре цифры без разделителей.","options":[],"answer":"2431","hints":["Find the rightmost position that can be increased.","The last two digits 13 can be replaced by their next arrangement."],"ruHints":["Найдите крайнюю справа позицию, которую можно увеличить.","Последние две цифры 13 можно заменить следующей перестановкой."],"steps":["The prefix 24 remains unchanged.","Replacing the suffix 13 by 31 gives the smallest larger permutation: 2431."],"ruSteps":["Префикс 24 остаётся неизменным.","Замена суффикса 13 на 31 даёт минимальную большую перестановку: 2431."],"section":"8.4","page":276},{"id":"c8-h1","chapter":8,"level":"Hard","type":"number","prompt":"For each integer $i=1,\\ldots,40$, a loop runs $j=1,\\ldots,i$; for each pair $(i,j)$ it performs exactly $j$ additions. How many additions are performed in total?","ruPrompt":"Для каждого $i=1,\\ldots,40$ выполняется цикл $j=1,\\ldots,i$; для каждой пары $(i,j)$ выполняется ровно $j$ сложений. Сколько сложений будет всего?","options":[],"answer":"11480","hints":["For a fixed i, sum $1+2+\\cdots+i$.","Use $\\sum_{i=1}^n i(i+1)/2=n(n+1)(n+2)/6$."],"ruHints":["Для фиксированного i найдите сумму $1+2+\\cdots+i$.","Используйте $\\sum_{i=1}^n i(i+1)/2=n(n+1)(n+2)/6$."],"steps":["For each i the count is $i(i+1)/2$.","Total count is $\\frac12(\\sum i^2+\\sum i)=40\\cdot41\\cdot42/6$.","The result is 11480 additions."],"ruSteps":["Для каждого i число сложений равно $i(i+1)/2$.","Общее число: $\\frac12(\\sum i^2+\\sum i)=40\\cdot41\\cdot42/6$.","Получаем 11480 сложений."],"section":"8.2","page":253},{"id":"c8-h2","chapter":8,"level":"Hard","type":"number","prompt":"A comparison count obeys $C(1)=0$ and $C(n)=2C(n/2)+n-1$ for powers of two n. Compute $C(32)$.","ruPrompt":"Число сравнений удовлетворяет $C(1)=0$ и $C(n)=2C(n/2)+n-1$ для n, являющихся степенями двойки. Найдите $C(32)$.","options":[],"answer":"129","hints":["This models two recursive halves followed by a worst-case merge.","Compute the values for 2, 4, 8, 16, then 32."],"ruHints":["Это модель двух рекурсивных половин и слияния в худшем случае.","Последовательно найдите значения для 2, 4, 8, 16 и 32."],"steps":["$C(2)=1$, $C(4)=5$, $C(8)=17$.","$C(16)=2\\cdot17+15=49$.","$C(32)=2\\cdot49+31=129$; equivalently, $C(n)=n\\log_2 n-n+1$."],"ruSteps":["$C(2)=1$, $C(4)=5$, $C(8)=17$.","$C(16)=2\\cdot17+15=49$.","$C(32)=2\\cdot49+31=129$; общая формула $C(n)=n\\log_2 n-n+1$."],"section":"8.3","page":265},{"id":"c9-e1","chapter":9,"level":"Easy","type":"number","prompt":"A simple undirected graph has degree sequence 4, 3, 3, 2, 2, 2. How many edges does it have?","ruPrompt":"Степени вершин простого неориентированного графа: 4, 3, 3, 2, 2, 2. Сколько в нём рёбер?","options":[],"answer":"8","hints":["Each edge contributes to two vertex degrees.","Add the degrees and divide by two."],"ruHints":["Каждое ребро учитывается в степенях двух вершин.","Сложите степени и разделите сумму на два."],"steps":["The degree sum is 16.","By the handshaking identity $2|E|=16$, so $|E|=8$."],"ruSteps":["Сумма степеней равна 16.","По лемме о рукопожатиях $2|E|=16$, значит, $|E|=8$."],"section":"9.2","page":288},{"id":"c9-e2","chapter":9,"level":"Easy","type":"number","prompt":"How many edges are in the complete bipartite graph $K_{3,5}$?","ruPrompt":"Сколько рёбер в полном двудольном графе $K_{3,5}$?","options":[],"answer":"15","hints":["Every vertex in one part is joined to every vertex in the other.","Count the choices of one endpoint in each part."],"ruHints":["Каждая вершина одной доли соединена с каждой вершиной другой.","Посчитайте способы выбрать по одной вершине из каждой доли."],"steps":["There are 3 choices in the first part and 5 in the second.","Hence $|E|=3\\cdot5=15$."],"ruSteps":["Есть 3 варианта в первой доле и 5 во второй.","Поэтому $|E|=3\\cdot5=15$."],"section":"9.2","page":291},{"id":"c9-m1","chapter":9,"level":"Medium","type":"mcq","prompt":"Graph G has vertices a,b,c,d,e,f and edges ab,bc,cd,de,ef,fa. Graph H has vertices 1,2,3,4,5,6 and edges 12,23,31,45,56,64. Are G and H isomorphic?","ruPrompt":"Граф G: вершины a,b,c,d,e,f, рёбра ab,bc,cd,de,ef,fa. Граф H: вершины 1,2,3,4,5,6, рёбра 12,23,31,45,56,64. Изоморфны ли G и H?","options":["Yes: the degree sequences agree.","Yes: each graph has six edges.","No: G is connected and H has two components.","No: H has more vertices."],"answer":"No: G is connected and H has two components.","hints":["Both degree sequences are 2,2,2,2,2,2.","An isomorphism preserves connected components, not just degrees."],"ruHints":["У обоих графов степени равны 2,2,2,2,2,2.","Изоморфизм сохраняет компоненты связности, а не только степени."],"steps":["G is a single six-cycle and is connected.","H is the disjoint union of two triangles, so has two components.","Different component counts rule out an isomorphism."],"ruSteps":["G — один цикл из шести вершин, поэтому связен.","H — объединение двух непересекающихся треугольников, то есть имеет две компоненты.","Разное число компонент исключает изоморфизм."],"section":"9.3","page":296},{"id":"c9-m2","chapter":9,"level":"Medium","type":"mcq","prompt":"Can a simple undirected graph on four vertices have degree sequence 3,3,3,1?","ruPrompt":"Может ли простой неориентированный граф на четырёх вершинах иметь степени 3,3,3,1?","options":["Yes: the degree sum is even.","No: the fourth vertex would be adjacent to all three degree-3 vertices.","No: every graph must have an odd vertex count.","Yes: this is a four-cycle."],"answer":"No: the fourth vertex would be adjacent to all three degree-3 vertices.","hints":["In a simple graph with four vertices, degree 3 means adjacency to every other vertex.","Apply that observation to all three vertices of degree 3."],"ruHints":["В простом графе на четырёх вершинах степень 3 означает смежность со всеми остальными.","Примените это к каждой из трёх вершин степени 3."],"steps":["Each of the three degree-3 vertices must meet the fourth vertex.","The fourth vertex therefore also has degree 3, contradicting degree 1.","An even degree sum is necessary but not sufficient."],"ruSteps":["Каждая из трёх вершин степени 3 соединена с четвёртой.","У четвёртой также должна быть степень 3, что противоречит степени 1.","Чётность суммы степеней необходима, но недостаточна."],"section":"9.2","page":288},{"id":"c9-h1","chapter":9,"level":"Hard","type":"number","prompt":"A simple graph has 12 vertices and 21 edges. Every vertex has degree 3 or degree 4. How many vertices have degree 4?","ruPrompt":"Простой граф имеет 12 вершин и 21 ребро. Степень каждой вершины равна 3 или 4. Сколько вершин имеют степень 4?","options":[],"answer":"6","hints":["Let x be the number of vertices of degree 4.","The remaining 12−x vertices have degree 3. Apply the handshaking identity."],"ruHints":["Пусть x — число вершин степени 4.","Остальные 12−x вершин имеют степень 3. Примените лемму о рукопожатиях."],"steps":["The degree sum is $2\\cdot21=42$.","Thus $4x+3(12-x)=42$.","Simplifying gives $x+36=42$, hence $x=6$."],"ruSteps":["Сумма степеней равна $2\\cdot21=42$.","Получаем $4x+3(12-x)=42$.","После упрощения $x+36=42$, откуда $x=6$."],"section":"9.2","page":288},{"id":"c9-h2","chapter":9,"level":"Hard","type":"number","prompt":"How many automorphisms (isomorphisms from a graph to itself) does $K_{3,3}$ have? Its two parts are $\\{a,b,c\\}$ and $\\{x,y,z\\}$.","ruPrompt":"Сколько автоморфизмов (изоморфизмов графа на себя) имеет $K_{3,3}$ с долями $\\{a,b,c\\}$ и $\\{x,y,z\\}$?","options":[],"answer":"72","hints":["Nonadjacent distinct vertices lie in the same part.","An automorphism either preserves both parts or swaps them; within a part all permutations work."],"ruHints":["Несмежные различные вершины лежат в одной доле.","Автоморфизм либо сохраняет доли, либо меняет их местами; внутри доли допустима любая перестановка."],"steps":["Preserving nonadjacency forces each entire part to map to one entire part.","There are $3!\\cdot3!=36$ maps preserving the parts and another 36 swapping them.","Total: $2(3!)^2=72$."],"ruSteps":["Сохранение несмежности заставляет каждую долю целиком переходить в одну долю.","Есть $3!\\cdot3!=36$ отображений, сохраняющих доли, и ещё 36, меняющих их местами.","Итого $2(3!)^2=72$."],"section":"9.3","page":296},{"id":"c10-e1","chapter":10,"level":"Easy","type":"mcq","prompt":"A connected undirected graph has exactly two odd-degree vertices. Which conclusion is correct?","ruPrompt":"Связный неориентированный граф имеет ровно две вершины нечётной степени. Какой вывод верен?","options":["It has no Eulerian trail.","It has an Eulerian circuit.","It has an Eulerian trail but no Eulerian circuit.","It must have a Hamiltonian cycle."],"answer":"It has an Eulerian trail but no Eulerian circuit.","hints":["An Eulerian circuit enters and leaves every vertex equally often.","A nonclosed Eulerian trail has two exceptional endpoints."],"ruHints":["В эйлеровом цикле каждому входу в вершину соответствует выход.","У незамкнутого эйлерова маршрута есть две особые конечные вершины."],"steps":["Exactly two odd vertices permit a trail using every edge once, starting and ending at those vertices.","A circuit would require every degree to be even."],"ruSteps":["При двух нечётных вершинах можно пройти каждое ребро один раз, начав в одной из них и закончив в другой.","Для замкнутого маршрута все степени должны быть чётными."],"section":"10.1","page":304},{"id":"c10-e2","chapter":10,"level":"Easy","type":"mcq","prompt":"What does a Hamiltonian cycle in a simple graph visit exactly once before returning to its start?","ruPrompt":"Что гамильтонов цикл в простом графе посещает ровно один раз перед возвращением в начальную точку?","options":["Every edge.","Every vertex.","Every connected component.","Every possible pair of vertices."],"answer":"Every vertex.","hints":["Distinguish the objects counted by Eulerian and Hamiltonian conditions.","The Hamiltonian condition is about vertices."],"ruHints":["Различайте объекты, учитываемые в условиях Эйлера и Гамильтона.","Гамильтоново условие относится к вершинам."],"steps":["A Hamiltonian cycle contains all vertices of the graph.","Only the initial vertex is repeated to close the cycle."],"ruSteps":["Гамильтонов цикл содержит все вершины графа.","Начальная вершина повторяется только для замыкания цикла."],"section":"10.2","page":311},{"id":"c10-m1","chapter":10,"level":"Medium","type":"number","prompt":"An undirected simple graph has vertices a,b,c,d and edges ab,bc,cd,da,ac. If A is its adjacency matrix, what is $(A^2)_{a,c}$?","ruPrompt":"Простой неориентированный граф имеет вершины a,b,c,d и рёбра ab,bc,cd,da,ac. Если A — его матрица смежности, чему равно $(A^2)_{a,c}$?","options":[],"answer":"2","hints":["An entry in the square counts walks of length two.","List the common neighbors of a and c."],"ruHints":["Элемент квадрата матрицы считает маршруты длины два.","Перечислите общих соседей a и c."],"steps":["The possible intermediate vertices are b and d.","The two walks are a-b-c and a-d-c, so the entry is 2."],"ruSteps":["Промежуточной вершиной может быть b или d.","Два маршрута: a-b-c и a-d-c, поэтому элемент равен 2."],"section":"10.3","page":319},{"id":"c10-m2","chapter":10,"level":"Medium","type":"number","prompt":"An undirected weighted graph has vertices s,a,b,c,t and only these edges: sa:4, sb:1, ab:2, ac:2, bc:7, bt:10, ct:3. Find the shortest distance from s to t.","ruPrompt":"Неориентированный взвешенный граф имеет вершины s,a,b,c,t и только рёбра sa:4, sb:1, ab:2, ac:2, bc:7, bt:10, ct:3. Найдите кратчайшее расстояние от s до t.","options":[],"answer":"8","hints":["The cheapest route to a need not be the direct edge sa.","Reach b first, then improve the tentative distance to a."],"ruHints":["Самый дешёвый путь к a может не совпадать с ребром sa.","Сначала достигните b, затем улучшите оценку расстояния до a."],"steps":["Dijkstra gives distances b=1, a=3, c=5, t=8.","The path s-b-a-c-t has weight $1+2+2+3=8$."],"ruSteps":["Алгоритм Дейкстры даёт расстояния b=1, a=3, c=5, t=8.","Путь s-b-a-c-t имеет вес $1+2+2+3=8$."],"section":"10.4","page":326},{"id":"c10-h1","chapter":10,"level":"Hard","type":"number","prompt":"An undirected simple graph has vertices a,b,c,d and edges ab,bc,cd,da,ac. How many walks of exactly four edges start at a and end at c? Vertices and edges may be repeated.","ruPrompt":"Простой неориентированный граф имеет вершины a,b,c,d и рёбра ab,bc,cd,da,ac. Сколько маршрутов ровно из четырёх рёбер идут из a в c? Вершины и рёбра могут повторяться.","options":[],"answer":"14","hints":["Count walks ending at each vertex after each step.","At the next step, the count at a vertex is the sum of counts at its neighbors."],"ruHints":["После каждого шага считайте маршруты, заканчивающиеся в каждой вершине.","На следующем шаге число маршрутов в вершине равно сумме чисел у её соседей."],"steps":["In vertex order (a,b,c,d), the initial counts are (1,0,0,0).","After one, two and three steps they are (0,1,1,1), (3,1,2,1), and (4,5,5,5).","The neighbors of c are a,b,d, so the four-step count is $4+5+5=14$."],"ruSteps":["В порядке (a,b,c,d) начальные количества равны (1,0,0,0).","После одного, двух и трёх шагов: (0,1,1,1), (3,1,2,1), (4,5,5,5).","Соседи c — a,b,d, поэтому после четырёх шагов получаем $4+5+5=14$."],"section":"10.3","page":319},{"id":"c10-h2","chapter":10,"level":"Hard","type":"number","prompt":"Start with $K_{4,6}$, with parts X and Y of sizes 4 and 6. You may add edges only between vertices of Y, with no loops or parallel edges. What is the minimum number of added edges that makes a Hamiltonian cycle possible?","ruPrompt":"Дан $K_{4,6}$ с долями X и Y размеров 4 и 6. Можно добавлять рёбра только между вершинами Y, без петель и кратных рёбер. Каково минимальное число рёбер, позволяющее получить гамильтонов цикл?","options":[],"answer":"2","hints":["On a Hamiltonian cycle, every X vertex has two incident cross-edges.","The six Y vertices have total cycle-degree 12, while cross-edges contribute only 8."],"ruHints":["В гамильтоновом цикле каждая вершина X имеет два ребра между долями.","Суммарная степень шести вершин Y в цикле равна 12, но рёбра между долями дают лишь 8."],"steps":["The four X vertices force exactly 8 cross-edges in the cycle. Thus $12=8+2k$, giving $k=2$ edges within Y.","Add $y_1y_2$ and $y_2y_3$.","The cycle $x_1y_1y_2y_3x_2y_4x_3y_5x_4y_6x_1$ uses all vertices, so two edges suffice."],"ruSteps":["Четыре вершины X дают ровно 8 рёбер между долями. Поэтому $12=8+2k$, то есть нужны $k=2$ ребра внутри Y.","Добавим $y_1y_2$ и $y_2y_3$.","Цикл $x_1y_1y_2y_3x_2y_4x_3y_5x_4y_6x_1$ проходит все вершины, значит, двух рёбер достаточно."],"section":"10.2","page":311},{"id":"c11-e1","chapter":11,"level":"Easy","type":"number","prompt":"A digraph has outdegrees 3,2,1,1,0. What is the sum of all its indegrees?","ruPrompt":"Полустепени исхода вершин орграфа равны 3,2,1,1,0. Чему равна сумма полустепеней захода?","options":[],"answer":"7","hints":["Each arc has one starting vertex and one ending vertex.","Both sums equal the total number of arcs."],"ruHints":["У каждой дуги есть одна начальная и одна конечная вершина.","Обе суммы равны общему числу дуг."],"steps":["The arc count is $3+2+1+1+0=7$.","Each arc contributes one to the total indegree, so the answer is 7."],"ruSteps":["Число дуг равно $3+2+1+1+0=7$.","Каждая дуга увеличивает сумму полустепеней захода на один, поэтому ответ 7."],"section":"11.2","page":344},{"id":"c11-e2","chapter":11,"level":"Easy","type":"number","prompt":"A tournament has 8 vertices: for each pair of distinct vertices, exactly one of the two possible directed arcs is present. How many arcs does it have?","ruPrompt":"В турнире 8 вершин: для каждой пары различных вершин присутствует ровно одна из двух возможных дуг. Сколько всего дуг?","options":[],"answer":"28","hints":["Each unordered pair corresponds to one match and one arc.","Choose two vertices out of eight."],"ruHints":["Каждая неупорядоченная пара соответствует одному матчу и одной дуге.","Выберите две вершины из восьми."],"steps":["There is one arc per unordered pair.","The number is $\\binom82=8\\cdot7/2=28$."],"ruSteps":["Каждой неупорядоченной паре соответствует одна дуга.","Количество равно $\\binom82=8\\cdot7/2=28$."],"section":"11.4","page":356},{"id":"c11-m1","chapter":11,"level":"Medium","type":"text","prompt":"Reconstruct an RNA chain from its complete enzyme digest. The G-enzyme cuts immediately after every G; the U,C-enzyme cuts immediately after every U or C. Unordered G-fragments: ACG, UAG, C. Unordered U,C-fragments: AC, GU, AGC. Enter the chain using uppercase letters without spaces.","ruPrompt":"Восстановите РНК по полному ферментативному расщеплению. G-фермент режет сразу после каждого G; U,C-фермент — сразу после каждого U или C. Неупорядоченные G-фрагменты: ACG, UAG, C. Неупорядоченные U,C-фрагменты: AC, GU, AGC. Введите цепочку заглавными буквами без пробелов.","options":[],"answer":"ACGUAGC","hints":["The abnormal G-fragment C must be the final fragment.","Test the two possible orders of ACG and UAG before the final C against the U,C-digest."],"ruHints":["Аномальный G-фрагмент C должен стоять последним.","Проверьте два порядка ACG и UAG перед конечным C по U,C-фрагментам."],"steps":["C must be last because every nonfinal G-fragment ends with G.","The two G-compatible chains are ACGUAGC and UAGACGC.","ACGUAGC splits after U or C into AC | GU | AGC, exactly the second digest. The other candidate does not."],"ruSteps":["C стоит последним, так как каждый неконечный G-фрагмент заканчивается на G.","Две совместимые с G-расщеплением цепочки: ACGUAGC и UAGACGC.","ACGUAGC распадается после U или C на AC | GU | AGC, как требуется. Другая цепочка не подходит."],"section":"11.3","page":352},{"id":"c11-m2","chapter":11,"level":"Medium","type":"number","prompt":"Tasks A,B,C,D,E take 3,5,4,2,3 hours respectively. A and B can start at time 0. C requires A; D requires both A and B; E requires both C and D. There are unlimited workers, and tasks may run in parallel. What is the earliest project completion time?","ruPrompt":"Задачи A,B,C,D,E длятся соответственно 3,5,4,2,3 часа. A и B можно начать в момент 0. C требует завершения A; D — A и B; E — C и D. Работников достаточно, допускается параллельная работа. Каково минимальное время завершения проекта?","options":[],"answer":"10","hints":["A task starts when its latest prerequisite finishes.","Compute finishing times for C and D before starting E."],"ruHints":["Задача начинается после завершения самой поздней из её предпосылок.","Найдите времена завершения C и D перед запуском E."],"steps":["A finishes at 3 and B at 5. C finishes at 3+4=7; D finishes at max(3,5)+2=7.","E starts at 7 and finishes at 10. All these start times are feasible."],"ruSteps":["A завершается в 3, B — в 5. C завершается в 3+4=7; D — в max(3,5)+2=7.","E начинается в 7 и заканчивается в 10. Такой график выполним."],"section":"11.5","page":363},{"id":"c11-h1","chapter":11,"level":"Hard","type":"number","prompt":"A postman must start and finish at A and traverse every street at least once. Streets are undirected, with lengths AB:2, AC:4, AD:7, BC:3, BD:5, CD:2, and no others. What is the minimum total route length?","ruPrompt":"Почтальон должен начать и закончить в A и пройти каждую улицу хотя бы раз. Улицы неориентированные, длины: AB:2, AC:4, AD:7, BC:3, BD:5, CD:2; других улиц нет. Какова минимальная длина маршрута?","options":[],"answer":"27","hints":["All four vertices have odd degree; pair them using shortest-path distances.","Compare pairings AB+CD, AC+BD, and AD+BC. A direct edge need not be the shortest connection."],"ruHints":["Все четыре вершины имеют нечётную степень; объедините их в пары по кратчайшим расстояниям.","Сравните пары AB+CD, AC+BD и AD+BC. Прямое ребро не всегда задаёт кратчайший путь."],"steps":["The sum of all street lengths is $2+4+7+3+5+2=23$.","Shortest-pairing costs are 2+2=4, 4+5=9, and 6+3=9; the shortest A-D route is A-C-D.","Duplicate AB and CD, costing 4. All degrees become even, so an Eulerian circuit of length 23+4=27 exists."],"ruSteps":["Сумма длин улиц равна $2+4+7+3+5+2=23$.","Стоимость паросочетаний: 2+2=4, 4+5=9 и 6+3=9; кратчайший путь A-D — A-C-D.","Повторим AB и CD за 4. Все степени станут чётными, поэтому существует эйлеров цикл длины 23+4=27."],"section":"11.1","page":339},{"id":"c11-h2","chapter":11,"level":"Hard","type":"number","prompt":"A weighted digraph has vertices s,a,b,c,t and only these arcs: s→a:5, s→b:2, b→a:−4, a→c:3, b→c:6, c→t:2, a→t:8. Find the shortest distance from s to t.","ruPrompt":"Взвешенный орграф имеет вершины s,a,b,c,t и только дуги s→a:5, s→b:2, b→a:−4, a→c:3, b→c:6, c→t:2, a→t:8. Найдите кратчайшее расстояние от s до t.","options":[],"answer":"3","hints":["A negative arc can improve a vertex that already has a tentative distance.","The digraph is acyclic; process vertices in the order s,b,a,c,t, or use Bellman–Ford."],"ruHints":["Отрицательная дуга может улучшить уже найденную оценку расстояния.","Орграф ацикличен; обработайте вершины в порядке s,b,a,c,t или примените Беллмана–Форда."],"steps":["Distances to b and a are 2 and min(5,2−4)=−2.","The distance to c is min(2+6,−2+3)=1.","The distance to t is min(−2+8,1+2)=3, along s-b-a-c-t."],"ruSteps":["Расстояния до b и a равны 2 и min(5,2−4)=−2.","Расстояние до c равно min(2+6,−2+3)=1.","Расстояние до t равно min(−2+8,1+2)=3; путь s-b-a-c-t."],"section":"11.2","page":347},{"id":"c12-e1","chapter":12,"level":"Easy","type":"number","prompt":"How many edges does a tree with 18 vertices have?","ruPrompt":"Сколько рёбер в дереве с 18 вершинами?","options":[],"answer":"17","hints":["A tree is connected and contains no cycles.","For a tree, the number of edges is one less than the number of vertices."],"ruHints":["Дерево связно и не содержит циклов.","Число рёбер дерева на один меньше числа вершин."],"steps":["A tree satisfies $|E|=|V|-1$.","Thus $|E|=18-1=17$."],"ruSteps":["Для дерева $|E|=|V|-1$.","Следовательно, $|E|=18-1=17$."],"section":"12.1","page":370},{"id":"c12-e2","chapter":12,"level":"Easy","type":"mcq","prompt":"Which statement describes a spanning tree of a connected undirected graph G?","ruPrompt":"Какое утверждение описывает остовное дерево связного неориентированного графа G?","options":["It contains every edge of G.","It contains every vertex of G, is connected, and has no cycles.","It contains exactly one cycle.","It must be unique."],"answer":"It contains every vertex of G, is connected, and has no cycles.","hints":["The word spanning concerns which vertices are retained.","The word tree imposes connectivity and absence of cycles."],"ruHints":["Слово «остовное» указывает, какие вершины сохраняются.","Слово «дерево» требует связности и отсутствия циклов."],"steps":["A spanning subgraph includes every original vertex.","A spanning tree chooses enough original edges to connect those vertices without forming cycles."],"ruSteps":["Остовный подграф включает все исходные вершины.","Остовное дерево выбирает исходные рёбра так, чтобы соединить вершины без циклов."],"section":"12.2","page":379},{"id":"c12-m1","chapter":12,"level":"Medium","type":"text","prompt":"Run recursive depth-first search on the undirected graph with vertices A,B,C,D,E and edges AB,AC,BD,CD,CE. Start at A and always visit the alphabetically first unvisited neighbor. Enter the discovery order as five letters without separators.","ruPrompt":"Выполните рекурсивный поиск в глубину в неориентированном графе с вершинами A,B,C,D,E и рёбрами AB,AC,BD,CD,CE. Начните с A, выбирая по алфавиту первого непосещённого соседа. Введите порядок открытия вершин пятью буквами без разделителей.","options":[],"answer":"ABDCE","hints":["DFS continues down the current branch before returning.","From B the next unvisited neighbor is D, then C."],"ruHints":["DFS продолжает текущую ветвь перед возвратом.","Из B следующий непосещённый сосед — D, затем C."],"steps":["A first visits B; B visits D.","D visits C; C skips visited A and D and visits E.","The discovery order is A,B,D,C,E."],"ruSteps":["A сначала посещает B; из B переход к D.","Из D переход к C; C пропускает посещённые A и D и идёт в E.","Порядок открытия: A,B,D,C,E."],"section":"12.5","page":398},{"id":"c12-m2","chapter":12,"level":"Medium","type":"mcq","prompt":"A digraph on A,B,C,D,E has exactly the arcs A→C, B→C, B→D, C→E, D→E. Which ordering is a canonical (topological) ordering?","ruPrompt":"Орграф на A,B,C,D,E имеет только дуги A→C, B→C, B→D, C→E, D→E. Какой порядок является каноническим (топологическим)?","options":["A,C,B,D,E","D,A,B,C,E","B,A,D,C,E","B,A,D,E,C"],"answer":"B,A,D,C,E","hints":["Every arc must point forward in the ordering.","A and B must precede C; B must precede D; C and D must precede E."],"ruHints":["Каждая дуга должна идти вперёд по порядку.","A и B должны быть раньше C; B — раньше D; C и D — раньше E."],"steps":["In B,A,D,C,E, every prerequisite appears before its dependent vertex.","Each alternative violates at least one arc: C before B, D before B, or E before C."],"ruSteps":["В порядке B,A,D,C,E каждая предпосылка расположена перед зависимой вершиной.","Остальные варианты нарушают хотя бы одну дугу: C перед B, D перед B либо E перед C."],"section":"12.4","page":393},{"id":"c12-h1","chapter":12,"level":"Hard","type":"number","prompt":"Find the weight of a minimum spanning tree in the undirected graph with vertices A,B,C,D,E,F and edges AB:1, AC:4, BC:2, BD:5, CD:1, CE:3, DE:2, DF:4, EF:1.","ruPrompt":"Найдите вес минимального остовного дерева неориентированного графа с вершинами A,B,C,D,E,F и рёбрами AB:1, AC:4, BC:2, BD:5, CD:1, CE:3, DE:2, DF:4, EF:1.","options":[],"answer":"7","hints":["Kruskal adds the cheapest available edge that does not create a cycle.","First add the three edges of weight 1, then connect the resulting components."],"ruHints":["Алгоритм Краскала добавляет самое дешёвое ребро, не создающее цикл.","Сначала добавьте три ребра веса 1, затем соедините получившиеся компоненты."],"steps":["AB, CD and EF create three two-vertex components, with total weight 3.","BC and DE, each of weight 2, connect them without a cycle.","The five selected edges span six vertices and weigh 7. Kruskal guarantees minimality."],"ruSteps":["AB, CD и EF образуют три компоненты по две вершины с общим весом 3.","BC и DE веса 2 соединяют компоненты, не создавая цикла.","Пять выбранных рёбер соединяют шесть вершин и весят 7. Алгоритм Краскала гарантирует минимальность."],"section":"12.3","page":384},{"id":"c12-h2","chapter":12,"level":"Hard","type":"number","prompt":"A town has vertices A,B,C,D,E,F,G,H and undirected streets AB,BC,CA,DE,EF,FD,CD,FG,GH. Each street is either made one-way or kept two-way. What is the minimum number that must remain two-way so every vertex remains reachable from every other vertex?","ruPrompt":"В городе вершины A,B,C,D,E,F,G,H и неориентированные улицы AB,BC,CA,DE,EF,FD,CD,FG,GH. Каждую улицу делают односторонней или сохраняют двусторонней. Какое минимальное число улиц нужно оставить двусторонними, чтобы из любой вершины можно было попасть в любую другую?","options":[],"answer":"3","hints":["A bridge has no alternate route between its two sides.","Find the bridges, then orient each triangle cyclically."],"ruHints":["Мост не имеет обходного пути между своими сторонами.","Найдите мосты, затем ориентируйте каждый треугольник по циклу."],"steps":["CD, FG and GH are bridges; each must allow travel both ways.","Orient AB-BC-CA cyclically and DE-EF-FD cyclically.","Keeping exactly the three bridges two-way now allows travel between all vertices, proving the minimum is 3."],"ruSteps":["CD, FG и GH — мосты; каждый должен пропускать движение в обе стороны.","Ориентируйте AB-BC-CA и DE-EF-FD по циклу.","Оставив двусторонними только три моста, получаем взаимную достижимость всех вершин. Минимум равен 3."],"section":"12.6","page":403},{"id":"c13-e1","chapter":13,"level":"Easy","type":"number","prompt":"A connected plane graph has 8 vertices and 12 edges. How many regions does its drawing have, including the unbounded outer region?","ruPrompt":"Связный плоский граф имеет 8 вершин и 12 рёбер. Сколько областей в его рисунке, включая внешнюю неограниченную область?","options":[],"answer":"6","hints":["Use Euler’s formula for a connected plane graph.","$V-E+R=2$."],"ruHints":["Используйте формулу Эйлера для связного плоского графа.","$V-E+R=2$."],"steps":["$R=2-V+E=2-8+12=6$.","The outer region is included in this count."],"ruSteps":["$R=2-V+E=2-8+12=6$.","Внешняя область включена в подсчёт."],"section":"13.1","page":413},{"id":"c13-e2","chapter":13,"level":"Easy","type":"number","prompt":"What is the chromatic number of the cycle $C_7$?","ruPrompt":"Каково хроматическое число цикла $C_7$?","options":[],"answer":"3","hints":["Try alternating two colors around the cycle.","An odd cycle prevents the last edge from joining different alternating colors."],"ruHints":["Попробуйте чередовать два цвета по циклу.","У нечётного цикла последний переход соединит одинаковые чередующиеся цвета."],"steps":["Two colors fail because the cycle length is odd.","Color the first six vertices alternately and give the seventh a third color; hence the answer is 3."],"ruSteps":["Двух цветов недостаточно, потому что длина цикла нечётна.","Первые шесть вершин раскрасьте попеременно, седьмой дайте третий цвет. Ответ 3."],"section":"13.2","page":419},{"id":"c13-m1","chapter":13,"level":"Medium","type":"number","prompt":"Every simple bipartite planar graph with $n\\ge3$ vertices satisfies an edge bound. According to this bound, what is the largest possible number of edges when $n=10$?","ruPrompt":"Для любого простого двудольного планарного графа с $n\\ge3$ вершинами выполняется ограничение на число рёбер. Каково максимальное число рёбер при $n=10$ согласно этому ограничению?","options":[],"answer":"16","hints":["A bipartite graph has no odd cycles; use the planar bipartite bound.","The bound is E≤2V−4, and complete bipartite graphs with a part of size 2 attain it."],"ruHints":["Двудольный граф не имеет нечётных циклов; используйте усиленную планарную оценку.","Оценка E≤2V−4 достигается полным двудольным графом с одной долей размера 2."],"steps":["The bound gives $E\\le2\\cdot10-4=16$.","The planar graph $K_{2,8}$ has 10 vertices and 16 edges, so the bound is attainable."],"ruSteps":["По оценке $E\\le2\\cdot10-4=16$.","Планарный граф $K_{2,8}$ имеет 10 вершин и 16 рёбер, поэтому граница достигается."],"section":"13.1","page":414},{"id":"c13-m2","chapter":13,"level":"Medium","type":"number","prompt":"Six exams A,B,C,D,E,H must be assigned time slots. Conflicts are AB,BC,CD,DE,EA and HA,HB,HC,HD,HE; no other pairs conflict. Conflicting exams cannot share a slot. What is the minimum number of slots?","ruPrompt":"Шесть экзаменов A,B,C,D,E,H распределяют по временным слотам. Конфликтующие пары: AB,BC,CD,DE,EA и HA,HB,HC,HD,HE; других конфликтов нет. Конфликтующие экзамены нельзя ставить одновременно. Каково минимальное число слотов?","options":[],"answer":"4","hints":["The first five exams form an odd cycle.","H conflicts with all five, so its color cannot be used on that cycle."],"ruHints":["Первые пять экзаменов образуют нечётный цикл.","H конфликтует со всеми пятью, поэтому его цвет нельзя использовать на цикле."],"steps":["The cycle A-B-C-D-E-A requires three colors.","H is adjacent to all cycle vertices and needs a fourth color.","A three-coloring of the cycle plus a separate slot for H gives four slots."],"ruSteps":["Цикл A-B-C-D-E-A требует трёх цветов.","H смежна со всеми вершинами цикла и требует четвёртого цвета.","Три цвета для цикла и отдельный слот для H дают четыре слота."],"section":"13.2","page":419},{"id":"c13-h1","chapter":13,"level":"Hard","type":"number","prompt":"A connected simple plane graph has 14 vertices, all of degree 3. Every region boundary, including the outer one, is either a 4-cycle or a 5-cycle. How many regions have a 5-cycle boundary?","ruPrompt":"Связный простой плоский граф имеет 14 вершин степени 3. Граница каждой области, включая внешнюю, является циклом длины 4 или 5. У скольких областей граница имеет длину 5?","options":[],"answer":"6","hints":["First obtain the edge count from the vertex degrees, then the region count from Euler’s formula.","Every edge contributes two sides to region boundaries."],"ruHints":["Сначала найдите число рёбер по степеням, затем число областей по формуле Эйлера.","Каждое ребро вносит две стороны в границы областей."],"steps":["$E=3\\cdot14/2=21$ and $R=2-14+21=9$.","Let x and y count quadrilateral and pentagonal regions. Then $x+y=9$ and $4x+5y=2E=42$.","Subtracting $4(x+y)=36$ gives $y=6$."],"ruSteps":["$E=3\\cdot14/2=21$, а $R=2-14+21=9$.","Пусть x и y — числа четырёхугольных и пятиугольных областей. Тогда $x+y=9$ и $4x+5y=2E=42$.","Вычитая $4(x+y)=36$, получаем $y=6$."],"section":"13.1","page":413},{"id":"c13-h2","chapter":13,"level":"Hard","type":"mcq","prompt":"Obtain G by replacing each of the nine edges of $K_{3,3}$ with a path of length two, using a distinct new middle vertex for each edge. Which conclusion is correct?","ruPrompt":"Граф G получен заменой каждого из девяти рёбер $K_{3,3}$ путём длины два с отдельной новой промежуточной вершиной. Какой вывод верен?","options":["G is planar because $18\\le3\\cdot15-6$.","G is nonplanar because it is a subdivision of $K_{3,3}$.","G is planar because every new vertex has degree 2.","G is nonplanar because it has fewer than 3 vertices."],"answer":"G is nonplanar because it is a subdivision of $K_{3,3}$.","hints":["Count the new vertices and edges, but do not confuse a necessary edge bound with a planarity test.","Subdividing edges does not remove a topological obstruction to planarity."],"ruHints":["Посчитайте новые вершины и рёбра, но не считайте необходимую оценку достаточным тестом планарности.","Подразделение рёбер не устраняет топологическое препятствие планарности."],"steps":["G has $6+9=15$ vertices and $18$ edges, so it satisfies $E\\le3V-6$.","If G had a plane drawing, suppressing the nine degree-2 vertices would give a plane drawing of $K_{3,3}$.","That is impossible; hence G is nonplanar despite satisfying the edge bound."],"ruSteps":["У G $6+9=15$ вершин и $18$ рёбер, поэтому $E\\le3V-6$ выполняется.","Если бы G имел плоский рисунок, можно было бы подавить девять промежуточных вершин степени 2: заменить каждую двухрёберную цепочку одним ребром. Получился бы плоский рисунок $K_{3,3}$.","Это невозможно; следовательно, G непланарен, хотя ограничение на число рёбер выполнено."],"section":"13.1","page":415},{"id":"c14-e1","chapter":14,"level":"Easy","type":"number","prompt":"At an intermediate vertex v of a feasible flow, incoming arc flows are 2 and 5; outgoing arc flows are 3 and x. There are no other incident arcs. What is x?","ruPrompt":"В промежуточную вершину v допустимого потока входят дуги с потоками 2 и 5; выходят дуги с потоками 3 и x. Других инцидентных дуг нет. Чему равен x?","options":[],"answer":"4","hints":["At a vertex other than the source and sink, flow is conserved.","Total inflow equals total outflow."],"ruHints":["В вершине, отличной от истока и стока, выполняется сохранение потока.","Суммарный вход равен суммарному выходу."],"steps":["$2+5=3+x$.","Hence $x=4$."],"ruSteps":["$2+5=3+x$.","Следовательно, $x=4$."],"section":"14.1","page":438},{"id":"c14-e2","chapter":14,"level":"Easy","type":"number","prompt":"A directed network has vertices s,a,b,t and arc capacities s→a:5, s→b:4, a→b:2, b→a:1, a→t:3, b→t:6. Find the capacity of the cut S={s,a}, T={b,t}.","ruPrompt":"В сети вершины s,a,b,t и ёмкости дуг s→a:5, s→b:4, a→b:2, b→a:1, a→t:3, b→t:6. Найдите ёмкость разреза S={s,a}, T={b,t}.","options":[],"answer":"9","hints":["Only arcs directed from S to T contribute to cut capacity.","Do not include arcs inside one part or arcs from T back to S."],"ruHints":["В ёмкость разреза входят только дуги из S в T.","Не учитывайте дуги внутри долей и дуги из T обратно в S."],"steps":["The crossing arcs in the correct direction are s→b, a→b, and a→t.","The cut capacity is $4+2+3=9$."],"ruSteps":["В нужном направлении разрез пересекают s→b, a→b и a→t.","Ёмкость разреза равна $4+2+3=9$."],"section":"14.1","page":440},{"id":"c14-m1","chapter":14,"level":"Medium","type":"number","prompt":"A network has vertices s,a,b,t and only arcs s→a:8, s→b:5, a→b:3, a→t:4, b→t:6 (numbers are capacities). What is the maximum s–t flow value?","ruPrompt":"В сети вершины s,a,b,t и только дуги s→a:8, s→b:5, a→b:3, a→t:4, b→t:6; числа — ёмкости. Чему равен максимальный поток из s в t?","options":[],"answer":"10","hints":["The arcs entering t give an upper bound.","Try to saturate both a→t and b→t, routing some flow through a→b."],"ruHints":["Дуги, входящие в t, задают верхнюю границу.","Попробуйте насытить a→t и b→t, направив часть потока через a→b."],"steps":["The cut with T={t} has capacity $4+6=10$.","Set flows s→a=5, s→b=5, a→b=1, a→t=4, b→t=6. All capacities and conservation laws hold.","This feasible flow has value 10, matching the cut bound; it is maximum."],"ruSteps":["Разрез с T={t} имеет ёмкость $4+6=10$.","Зададим потоки s→a=5, s→b=5, a→b=1, a→t=4, b→t=6. Ограничения ёмкости и сохранение потока выполнены.","Допустимый поток 10 совпадает с ёмкостью разреза, значит, он максимален."],"section":"14.1","page":441},{"id":"c14-m2","chapter":14,"level":"Medium","type":"number","prompt":"A bipartite graph has left part {A,B,C,D} and right part {1,2,3,4}. Neighbor sets are N(A)=N(B)=N(C)={1,2} and N(D)={3,4}. What is its maximum matching size?","ruPrompt":"Двудольный граф имеет левую долю {A,B,C,D}, правую {1,2,3,4}. Множества соседей: N(A)=N(B)=N(C)={1,2}, N(D)={3,4}. Каков размер максимального паросочетания?","options":[],"answer":"3","hints":["A,B,C collectively have only two possible partners.","Use Hall’s condition to rule out size 4, then construct size 3."],"ruHints":["У A,B,C вместе лишь два возможных партнёра.","Условием Холла исключите размер 4, затем постройте паросочетание размера 3."],"steps":["For X={A,B,C}, |N(X)|=2<3=|X|, so no matching saturates the left part.","Edges A-1, B-2, D-3 form a matching of size 3.","The upper bound and construction agree: maximum size 3."],"ruSteps":["Для X={A,B,C} имеем |N(X)|=2<3=|X|, поэтому всю левую долю насытить нельзя.","Рёбра A-1, B-2, D-3 образуют паросочетание размера 3.","Верхняя граница достигается: максимум равен 3."],"section":"14.4","page":454},{"id":"c14-h1","chapter":14,"level":"Hard","type":"number","prompt":"A network has arcs listed as capacity/current flow: s→a:4/4, s→b:3/1, a→b:3/2, a→t:3/2, b→t:4/3. The current flow is feasible. What maximum flow value can be reached, allowing residual backward arcs?","ruPrompt":"Дуги сети заданы как ёмкость/текущий поток: s→a:4/4, s→b:3/1, a→b:3/2, a→t:3/2, b→t:4/3. Текущий поток допустим. Какой максимальный поток можно получить с использованием обратных остаточных дуг?","options":[],"answer":"7","hints":["The current flow value is 5. The total capacity entering t is 7.","The residual path s→b→a→t uses b→a backward along the current a→b flow."],"ruHints":["Текущий поток равен 5. Суммарная ёмкость дуг в t равна 7.","Остаточный путь s→b→a→t проходит b→a против направления текущего потока a→b."],"steps":["Augment by 1 along s→b→a→t: s→b becomes 2, a→b decreases to 1, and a→t becomes 3. The value rises to 6.","Then augment by 1 along s→b→t, producing flows s→a=4, s→b=3, a→b=1, a→t=3, b→t=4.","The value is 7, equal to the cut capacity $c(a,t)+c(b,t)=3+4=7$, so it is maximum."],"ruSteps":["Увеличьте поток на 1 вдоль s→b→a→t: s→b станет 2, a→b уменьшится до 1, a→t станет 3. Значение потока возрастёт до 6.","Затем добавьте 1 по s→b→t. Итог: s→a=4, s→b=3, a→b=1, a→t=3, b→t=4.","Значение 7 равно ёмкости разреза $c(a,t)+c(b,t)=3+4=7$, поэтому поток максимален."],"section":"14.2","page":445},{"id":"c14-h2","chapter":14,"level":"Hard","type":"number","prompt":"A bipartite graph has parts {A,B,C,D} and {1,2,3,4}, with neighbor sets N(A)={1,2}, N(B)={1,2,3}, N(C)={2,3,4}, N(D)={3,4}. How many distinct perfect matchings does it have?","ruPrompt":"Двудольный граф имеет доли {A,B,C,D} и {1,2,3,4}, с соседями N(A)={1,2}, N(B)={1,2,3}, N(C)={2,3,4}, N(D)={3,4}. Сколько различных совершенных паросочетаний в нём?","options":[],"answer":"5","hints":["Split into the two cases A matched with 1 or with 2.","In each case, assign the three remaining right vertices without repeating any."],"ruHints":["Рассмотрите два случая: A соединяется с 1 либо с 2.","В каждом случае распределите три оставшиеся правые вершины без повторений."],"steps":["If A-1 is chosen, B-2 allows two choices for C,D; B-3 forces C-2 and D-4. This gives 3 matchings.","If A-2 is chosen, B-1 allows two choices for C,D; B-3 leaves vertex 1 unavailable to C,D and is impossible. This gives 2.","The total is 3+2=5 perfect matchings."],"ruSteps":["Если выбрано A-1, при B-2 есть два варианта для C,D; при B-3 остаётся C-2 и D-4. Всего 3 паросочетания.","Если выбрано A-2, при B-1 есть два варианта для C,D; при B-3 вершину 1 нельзя соединить с C или D. Всего 2.","Получаем 3+2=5 совершенных паросочетаний."],"section":"14.4","page":454}];
</script>
<script>
'use strict';
// Buildless, browser-only study lab. Content is deliberately inspectable: this is
// an exam preparation simulator, not a secure assessment or proctoring system.
const BANK_VERSION='gp3-1', STORAGE_KEY='discrete-lab:gp3:v1';
const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));
const byId=new Map(QUESTIONS.map(q=>[q.id,q]));
const chapterById=new Map(CHAPTERS.map(c=>[c.id,c]));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon=name=>`<i data-lucide="${name}" aria-hidden="true"></i>`;
const pad=n=>String(n).padStart(2,'0');
const now=()=>Date.now();
const defaultState=()=>({version:1,bankVersion:BANK_VERSION,prefs:{ru:true,theme:matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'},practice:{},read:[],exams:[],activeExam:null});
let storageOK=true,loadWarning='',state=defaultState(),bookURL=null,bookName='',bookTarget=1,toastTimer,route={view:'theory',chapter:0},practice={chapter:'all',level:'all',onlyUnsolved:false,qid:null,answer:'',hints:0,checked:false,correct:false},filter={query:'',chapter:'all'},shared=null;
const integer=(x,min,max)=>Number.isInteger(x)&&x>=min&&x<=max;
function validateExam(raw,active=false){
  if(!raw||!['full','quick'].includes(raw.mode)||!Array.isArray(raw.ids)||raw.ids.length!==(raw.mode==='full'?20:5)||new Set(raw.ids).size!==raw.ids.length||raw.ids.some(id=>!byId.has(id))) throw Error('Invalid exam questions.');
  if(!Number.isFinite(raw.startedAt)||raw.startedAt<0||!Number.isFinite(raw.deadline)||raw.deadline<=raw.startedAt||raw.deadline-raw.startedAt>90*60000||!raw.answers||typeof raw.answers!=='object'||Array.isArray(raw.answers))throw Error('Invalid exam data.');
  const answers={};
  for(const id of raw.ids){if(Object.hasOwn(raw.answers,id)){if(typeof raw.answers[id]!=='string'||raw.answers[id].length>500)throw Error('Invalid answer.');answers[id]=raw.answers[id];}}
  const clean={id:typeof raw.id==='string'?raw.id.slice(0,80):String(raw.startedAt),mode:raw.mode,seed:typeof raw.seed==='string'?raw.seed.slice(0,32):'imported',ids:[...raw.ids],answers,startedAt:raw.startedAt,deadline:raw.deadline,index:integer(raw.index,0,raw.ids.length-1)?raw.index:0};
  if(active){if(raw.startedAt>now()+60000)throw Error('Exam starts in the future.');}
  else{if(!Number.isFinite(raw.finishedAt)||raw.finishedAt<raw.startedAt||raw.finishedAt>raw.deadline)throw Error('Invalid finish time.');clean.finishedAt=raw.finishedAt;clean.reason=raw.reason==='timeout'?'timeout':'submitted';}
  return clean;
}
function validateState(raw){
